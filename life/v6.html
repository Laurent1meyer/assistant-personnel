@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fond:#0F1420;--carte:#1A2132;--encre:#E8EDF6;--doux:#97A3BA;--trait:#2A3348;--accent:#4C93FF}}
:root[data-theme="dark"]{--fond:#0F1420;--carte:#1A2132;--encre:#E8EDF6;--doux:#97A3BA;--trait:#2A3348;--accent:#4C93FF}
html,body{margin:0;height:100%;background:var(--fond);color:var(--encre);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.haut{display:flex;align-items:center;gap:8px;padding:10px 16px 6px;min-height:52px}
#retour{font-size:28px;line-height:1;color:var(--accent);width:28px}
#titre{flex:1;margin:0;font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#logo{width:34px;height:34px;border-radius:9px;background:var(--icone) center/cover;flex:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#bandeau{background:var(--rouge);color:#fff;text-align:center;font-size:14px;padding:6px 16px;width:100%}
#vue{flex:1;overflow-y:auto;padding:8px 16px 24px;-webkit-overflow-scrolling:touch}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:18px 10px;padding-top:8px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tuile{width:62px;height:62px;border-radius:15px;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:700;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tuile.dossier{background:color-mix(in srgb,var(--doux) 22%,var(--carte));grid-template-columns:repeat(3,12px);grid-auto-rows:12px;gap:4px;align-content:center;justify-content:center}
.tuile.dossier i{border-radius:3px;display:block;width:12px;height:12px}
.tuile .nb{position:absolute;right:-6px;top:-6px;background:var(--accent);color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.tuile .joue{position:absolute;right:4px;bottom:2px;font-size:12px}
.lab{font-size:12px;text-align:center;line-height:1.2;max-width:84px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.prive{position:absolute;left:4px;top:-4px;font-size:11px;z-index:1}
.barre{display:flex;justify-content:space-around;border-top:1px solid var(--trait);background:var(--carte);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0))}
.barre button{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--doux);min-width:64px;gap:2px}
.barre b{font-size:22px;font-weight:400;color:var(--encre)}
.barre .cl b{color:var(--claude)}
.barre .b-life{width:24px;height:24px;border-radius:6px;background:var(--icone) center/cover;display:block;margin-bottom:1px}
.doux{color:var(--doux);font-size:14px}
.pied{margin-top:28px;text-align:center}
.lien{color:var(--accent)}
.desc{margin:4px 0 10px}
.champs{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0 0 10px}
.champs dt{color:var(--doux)}.champs dd{margin:0;overflow-wrap:anywhere}
.champs a{color:var(--accent)}
.puce{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:3px 10px;font-size:13px;margin:2px}
.carte{background:var(--carte);border-radius:16px;padding:16px;margin:8px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.carte.centre{text-align:center}.carte.erreur{border:2px solid var(--rouge)}
.gros{font-size:54px}
.avatar{width:84px;height:84px;border-radius:50%;margin:0 auto;display:grid;place-items:center;color:#fff;font-size:36px;font-weight:700}
.rang{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.btn{display:inline-block;text-decoration:none;padding:10px 16px;border-radius:12px;background:color-mix(in srgb,var(--doux) 15%,var(--carte));color:var(--encre);font-weight:600}
.btn.prim{background:var(--accent);color:#fff}
.etage{font-size:15px;margin:18px 0 0;color:var(--doux);font-weight:600}.etage small{font-weight:400}
.liste{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.ligne{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:12px;background:var(--carte);position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ligne .t{font-weight:600}.ligne small{color:var(--doux);font-size:13px}
.ligne.sel{outline:2px solid var(--accent)}
.ligne .pt{position:absolute;right:12px;top:50%;width:10px;height:10px;border-radius:50%;transform:translateY(-50%)}
.formulaire label{display:block;font-size:13px;color:var(--doux);margin-bottom:10px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--encre);background:var(--fond);border:1px solid var(--trait);border-radius:10px;padding:10px;margin-top:4px}
#code{font:13px/1.4 ui-monospace,Menlo,monospace;white-space:pre;overflow:auto}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.reponse{white-space:pre-wrap;margin:0}
.traces{font-size:13px;color:var(--doux);padding-left:18px}
#voile{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#voile.on{opacity:1;pointer-events:auto}
#feuille{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--fond);border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0));transform:translateY(105%);transition:transform .22s;z-index:11}
#feuille.on{transform:none}
#feuille::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--trait);margin:0 auto 10px}
.q{display:block;font-weight:700;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0));transform:translate(-50%,20px);background:var(--encre);color:var(--fond);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#oeil{width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--doux);border:1.5px solid var(--trait);flex:none}
#oeil.on{background:var(--claude);border-color:var(--claude);color:#fff}
#vision{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 16px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--claude) 14%,var(--carte));font-size:13px}
#vision span{flex:1;min-width:150px}
#vision button{font-size:13px;font-weight:600;color:var(--claude);padding:4px 6px}
.claude-on .cache-claude .tuile,.claude-on .cache-claude.ligne{outline:2px dashed var(--claude);outline-offset:3px;filter:saturate(.35)}
.claude-on .cache-claude::after{content:"✦̸";position:absolute;left:4px;bottom:34px;font-size:12px;color:var(--claude)}
.claude-on .cache-claude.ligne::after{left:auto;right:12px;bottom:auto;top:10px}
.claude-on #vue.cache-claude-tout{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--claude) 55%,transparent);border-radius:14px}
.marque{position:absolute;right:2px;top:-6px;z-index:1;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px;color:#fff}
.marque.ok{background:#12976B}.marque.bloque{background:var(--rouge)}.marque.toi{background:var(--accent)}
.claude-on .cache-claude .marque{display:none}
pre.code{font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--carte);border:1px solid var(--trait);border-radius:10px;padding:10px;max-height:40vh;overflow:auto;white-space:pre-wrap}
details summary{cursor:pointer;margin-top:10px}
#fil{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0));background:var(--encre);color:var(--fond);border-radius:14px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-end;z-index:9;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#fil-l{flex:1;display:flex;flex-direction:column;gap:2px}#fil-l div:not(:last-child){opacity:.6}
#fil-stop{color:var(--fond);font-weight:700;font-size:13px;opacity:.8}
/* conversation */
.onglets{display:flex;gap:4px;background:color-mix(in srgb,var(--doux) 14%,var(--carte));border-radius:10px;padding:3px;margin:4px 0 10px}
.onglets button{flex:1;padding:7px;border-radius:8px;font-size:14px;font-weight:600;color:var(--doux)}
.onglets button.sel{background:var(--carte);color:var(--encre);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.fil-conv{display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.bulle{max-width:88%;padding:10px 13px;border-radius:18px;line-height:1.45;overflow-wrap:anywhere}
.bulle.moi{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.bulle.claude{align-self:flex-start;background:var(--carte);border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bulle.erreur{border:1.5px solid var(--rouge)}
.bulle code{font:13px ui-monospace,Menlo,monospace;background:color-mix(in srgb,var(--doux) 15%,transparent);padding:0 4px;border-radius:4px}
.puce-act{display:block;margin-top:8px;font-size:12px;font-weight:600;color:var(--claude)}
.points::after{content:"…";animation:pts 1.2s infinite steps(3)}
@keyframes pts{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}

<script>
const LifeDB = (() => {
  const D = {}; const subsC = {}; const subsD = {};
  let idb = null;
  const cle = (c, id) => c + "\u0000" + id;
  const clone = o => JSON.parse(JSON.stringify(o));
  function ouvrirIDB() {
    return new Promise((res, rej) => { const r = indexedDB.open("life", 2); r.onupgradeneeded = () => { const b = r.result; if (!b.objectStoreNames.contains("docs")) b.createObjectStore("docs"); if (!b.objectStoreNames.contains("fichiers")) b.createObjectStore("fichiers"); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  }
  async function charger() {
    idb = await ouvrirIDB();
    await new Promise((res, rej) => {
      const req = idb.transaction("docs").objectStore("docs").openCursor();
      req.onsuccess = () => { const c = req.result; if (!c) return res(); const [col, id] = String(c.key).split("\u0000"); (D[col] ||= {})[id] = c.value; c.continue(); };
      req.onerror = () => rej(req.error);
    });
    try { await navigator.storage?.persist?.(); } catch (_) {}
  }
  function persister(col, id, val) {
    return new Promise((res, rej) => { const tx = idb.transaction("docs", "readwrite"); const st = tx.objectStore("docs"); val === undefined ? st.delete(cle(col, id)) : st.put(val, cle(col, id)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  }
  const snapDoc = (c, id) => ({ id, exists: !!(D[c] && D[c][id]), data: () => D[c]?.[id], metadata: { fromCache: false, hasPendingWrites: false } });
  const snapCol = c => { const docs = Object.keys(D[c] || {}).sort().map(id => snapDoc(c, id)); return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } }; };
  function notifier(c, id) {
    for (const f of subsC[c] || []) queueMicrotask(() => f(snapCol(c)));
    for (const f of subsD[c + "/" + id] || []) queueMicrotask(() => f(snapDoc(c, id)));
  }
  async function ecrire(c, id, val) { D[c] ||= {}; if (val === undefined) delete D[c][id]; else D[c][id] = val; notifier(c, id); await persister(c, id, val); }
  const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  function ref(c, id) {
    return {
      id, path: c + "/" + id,
      get: async () => snapDoc(c, id),
      set: async o => ecrire(c, id, clone(o)),
      update: async o => { if (!D[c]?.[id]) throw { code: "invalid_argument", message: "document absent" }; const n = { ...D[c][id] }; for (const [k, v] of Object.entries(clone(o))) { if (v && v.__delete__) delete n[k]; else n[k] = v; } return ecrire(c, id, n); },
      delete: async () => ecrire(c, id, undefined),
      onSnapshot(f) { const k = c + "/" + id; (subsD[k] ||= []).push(f); queueMicrotask(() => f(snapDoc(c, id))); return () => { subsD[k] = (subsD[k] || []).filter(x => x !== f); }; }
    };
  }
  const db = {
    collection(c) { return {
      path: c,
      onSnapshot(f) { (subsC[c] ||= []).push(f); queueMicrotask(() => f(snapCol(c))); return () => { subsC[c] = (subsC[c] || []).filter(x => x !== f); }; },
      doc: id => ref(c, id || nid()),
      add: async o => { const id = nid(); await ecrire(c, id, clone(o)); return { id }; },
      get: async () => snapCol(c)
    }; },
    doc(p) { const [c, id] = String(p).split("/"); return ref(c, id); }
  };
  // Fichiers rapatriés : stockés à part, en binaire
  const tx1 = (mode, fn) => new Promise((res, rej) => { const tx = idb.transaction("fichiers", mode); const r = fn(tx.objectStore("fichiers")); tx.oncomplete = () => res(r?.result); tx.onerror = () => rej(tx.error); });
  const mettreFichier = (id, blob) => tx1("readwrite", st => st.put(blob, id));
  const lireFichier = id => tx1("readonly", st => st.get(id));
  const supprimerFichier = id => tx1("readwrite", st => st.delete(id));
  const idsFichiers = () => tx1("readonly", st => st.getAllKeys());
  const enBase64 = blob => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(String(f.result).split(",")[1] || ""); f.onerror = () => rej(f.error); f.readAsDataURL(blob); });
  async function exporter(opt = {}) {
    const out = { format: "life-export", version: 1, date: new Date().toISOString(), collections: clone(D) };
    if (opt.collections) out.collections = Object.fromEntries(Object.entries(out.collections).filter(([c]) => opt.collections.includes(c)));
    if (opt.fichiers) { out.fichiers = {}; for (const id of await idsFichiers()) { const b = await lireFichier(id); if (b) out.fichiers[id] = { type: b.type || "application/octet-stream", base64: await enBase64(b) }; } }
    return out;
  }
  async function importer(obj) {
    const cols = obj?.collections; if (!cols || typeof cols !== "object") throw new Error("fichier non reconnu");
    await new Promise((res, rej) => { const tx = idb.transaction("docs", "readwrite"); tx.objectStore("docs").clear(); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    for (const c of Object.keys(D)) delete D[c];
    await new Promise((res, rej) => { const tx = idb.transaction("docs", "readwrite"); const st = tx.objectStore("docs");
      for (const [c, docs] of Object.entries(cols)) for (const [id, v] of Object.entries(docs || {})) { (D[c] ||= {})[id] = v; st.put(v, cle(c, id)); }
      tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    if (obj.fichiers && typeof obj.fichiers === "object") for (const [id, f] of Object.entries(obj.fichiers)) {
      try { const bin = atob(f.base64 || ""); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); await mettreFichier(id, new Blob([u8], { type: f.type || "application/octet-stream" })); } catch (_) {}
    }
    const toutes = new Set([...Object.keys(subsC), ...Object.keys(D)]);
    for (const c of toutes) { for (const f of subsC[c] || []) queueMicrotask(() => f(snapCol(c))); }
    for (const k of Object.keys(subsD)) { const [c, id] = k.split("/"); for (const f of subsD[k]) queueMicrotask(() => f(snapDoc(c, id))); }
  }
  const vide = () => !Object.values(D).some(c => Object.keys(c || {}).length);
  return { charger, db, exporter, importer, vide, mettreFichier, lireFichier, supprimerFichier, idsFichiers };
})();

const LifeClaude = (() => {
  const MODELES = [["claude-opus-5-5", "Opus 5.5 · le plus capable"], ["claude-sonnet-5-5", "Sonnet 5.5 · équilibré"], ["claude-haiku-5-5", "Haiku 5.5 · rapide"]];
  let cle = null, webOK = true, jetons = 0;
  try { cle = localStorage.getItem("life-cle"); } catch (_) {}
  const reglages = () => { try { return JSON.parse(localStorage.getItem("life-claude") || "{}"); } catch (_) { return {}; } };
  const regler = r => { try { localStorage.setItem("life-claude", JSON.stringify({ ...reglages(), ...r })); } catch (_) {} };
  function definirCle(k, garder) { cle = String(k || "").trim() || null; try { if (garder && cle) localStorage.setItem("life-cle", cle); else localStorage.removeItem("life-cle"); } catch (_) {} }
  function oublierCle() { cle = null; try { localStorage.removeItem("life-cle"); } catch (_) {} }
  async function appel(corps, signal) {
    let r;
    try {
      r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", signal,
        headers: { "content-type": "application/json", "x-api-key": cle, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify(corps) });
    } catch (e) { if (e?.name === "AbortError") throw { code: "cancelled" }; throw { code: "network", message: "pas de réseau" }; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      const m = j?.error?.message || ("HTTP " + r.status);
      throw { code: r.status === 401 ? "bad_key" : r.status === 429 ? "rate_limited" : (r.status === 529 || r.status === 503) ? "overloaded" : r.status === 400 ? "invalid_request" : "api_error", message: m };
    }
    jetons += (j.usage?.input_tokens || 0) + (j.usage?.output_tokens || 0);
    return j;
  }
  // Même signature que le sample de l'artefact : (tours, {tools, onText, signal}) -> {text, truncated}
  async function sample(input, opts = {}) {
    if (!cle) throw { code: "no_key" };
    const r = reglages(); const model = r.modele || "claude-sonnet-5-5";
    let system = ""; let msgs = input.map(x => ({ role: x.role, content: x.content }));
    if (msgs[0]?.role === "user" && msgs[1]?.role === "assistant" && msgs[1].content === "Compris.") { system = msgs[0].content; msgs = msgs.slice(2); }
    const outils = (opts.tools || []).map(t => ({ name: t.name, description: t.description, input_schema: t.inputSchema || { type: "object", properties: {} } }));
    if (r.web === true && webOK) outils.push({ type: "web_search_20250305", name: "web_search", max_uses: 5 });
    let texte = "";
    for (let tour = 0; tour < (opts.maxTours || 12); tour++) {
      let j;
      try { j = await appel({ model, max_tokens: 8192, system, messages: msgs, ...(outils.length ? { tools: outils } : {}) }, opts.signal); }
      catch (e) {
        const iw = outils.findIndex(t => t.type);
        if (e.code === "invalid_request" && iw >= 0 && /web_search|tool/i.test(e.message || "")) { webOK = false; outils.splice(iw, 1); tour--; continue; }
        throw { ...e, text: texte || undefined };
      }
      const t = (j.content || []).filter(b => b.type === "text").map(b => b.text).join("");
      if (t) { texte += (texte ? "\n\n" : "") + t; opts.onText?.({ text: texte, delta: t }); }
      if (j.stop_reason === "pause_turn") { msgs.push({ role: "assistant", content: j.content }); continue; }
      if (j.stop_reason !== "tool_use") return { text: texte || "(pas de réponse)", truncated: j.stop_reason === "max_tokens", modelTierApplied: "complex", modelApplied: j.model };
      msgs.push({ role: "assistant", content: j.content });
      const resultats = [];
      for (const b of j.content.filter(b => b.type === "tool_use")) {
        const outil = (opts.tools || []).find(x => x.name === b.name);
        let sortie, erreur = false;
        try { if (!outil) throw new Error("outil inconnu"); sortie = await outil.execute(b.input || {}, { signal: opts.signal }); }
        catch (e) { sortie = "Error: " + (e?.message || e); erreur = true; }
        resultats.push({ type: "tool_result", tool_use_id: b.id, content: typeof sortie === "string" ? sortie : JSON.stringify(sortie ?? null), ...(erreur ? { is_error: true } : {}) });
      }
      msgs.push({ role: "user", content: resultats });
    }
    return { text: texte || "(trop d'allers-retours)", truncated: true, modelTierApplied: "complex" };
  }
  sample.limits = async () => ({ maxPromptBytes: 900000, tools: {} });
  return { sample, MODELES, definirCle, oublierCle, aCle: () => !!cle, reglages, regler, jetons: () => jetons, nomModele: () => (MODELES.find(m => m[0] === (reglages().modele || "claude-sonnet-5-5")) || [, "Sonnet 5.5"])[1].split(" · ")[0] };
})();

</script>
<script>
// =====================================================================
// Life v6 — le noyau. Il ne fait que quatre choses : lire et écrire la base,
// exécuter un verbe, garder les versions des verbes, démarrer en mode secours.
// Tout le reste (accueil, afficher, créer, aller…) est un verbe rangé dans la base.
// =====================================================================
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now = () => new Date().toISOString();
const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
const corps = fn => { const s = fn.toString(); return s.slice(s.indexOf("{") + 1, s.lastIndexOf("}")).replace(/^\n/, "").replace(/\s+$/, ""); };
function lsGet(k){ try { return localStorage.getItem(k); } catch(_) { return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(_) {} }

const K = { O:{}, V:{}, db:null, secours:false, sujet:null, pile:[], actions:{}, pret:false,
  claude:{ actif:false, montre:new Set(), travaille:null }, capture:null,
  focus:null, par:"Laurent", C:{}, imports:new Map() };
// Le monde courant n'est plus une bascule : il se déduit de l'objet regardé (dans le dossier de Claude → monde de Claude).
Object.defineProperty(K, "monde", { get(){ const f = K.focus ?? K.sujet; return f && chezClaude(f) ? "claude" : "laurent"; } });
// Deux Life dans la même base : celui de Laurent (racine « moi ») et celui de Claude (racine « life_claude »).
const RACINE = { laurent:"moi", claude:"life_claude" };
function racineDe(id){ let x=id, n=0; while (x && K.O[x] && K.O[x].parent && n++<40) x=K.O[x].parent; return x; }
const chezClaude = id => { let x=id, n=0; while (x && K.O[x] && n++<40) { if (x==="life_claude") return true; x=K.O[x].parent; } return false; };
// Ce que Claude connaît : ce que Laurent a partagé (ou que Claude a créé, qui naît partagé).
// Décision de Laurent (11/10) : Claude voit TOUTE la base. Seuls les secrets du coffre restent privés.
const connu = id => id==="moi" || !!K.O[id];
// Ce que Claude voit à cet instant : ce qu'il connaît + ce que Laurent vient de lui montrer.
const vu = id => connu(id) || K.claude.montre.has(id);
// Verbes écrits par Claude qui touchent au réseau, aux secrets ou aux données brutes : Laurent valide avant.
// Verbes écrits par Claude qui touchent aux secrets ou aux données brutes de l'app : Laurent valide avant (le réseau seul est libre).
// Types généraux (ceux de la base et des verbes d'origine) : Claude ne peut pas y ajouter une variante d'un verbe existant
const GENERAUX = new Set(["*","rien","moi","dossier","tache","note","projet","idee","personne","lieu","bien","envie","besoin","fonction","decision","document","application","conversation","site web","prompt","import","fichier"]);
const SENSIBLE = /\b(secret|oublierSecret|importScripts|localStorage|indexedDB|LifeDB|LifeClaude)\b|import\s*\(/;

// ---------- couleurs par type ----------
const COULEURS = { moi:"#1D74F5", envie:"#E8467C", projet:"#2F6BD8", tache:"#F07A1A", idee:"#8E5CF0", personne:"#D9A20B", lieu:"#0E9B73", bien:"#5E6E80",
  decision:"#0B8199", fonction:"#159AAE", dossier:"#4C6EF5", application:"#3B5BDB", conversation:"#8A94A6", document:"#6F7E95", note:"#7D8BA1",
  besoin:"#C2557A", fichier:"#6F7E95", "site web":"#0F8B8D" };
function couleur(t){ if (COULEURS[t]) return COULEURS[t]; let h=0; for (const c of String(t||"")) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 55% 48%)`; }
const lettre = o => (o?.emoji) || (String(o?.titre||"?").replace(/^[^\p{L}\p{N}]+/u,"")[0]||"?").toUpperCase();
const dateCourte = iso => iso ? new Date(iso).toLocaleDateString("fr-FR",{day:"numeric",month:"short"}) : "";

// ---------- base ----------
const copie = o => o ? JSON.parse(JSON.stringify(o)) : o;
const avecId = id => K.O[id] ? { id, ...copie(K.O[id]) } : null;
const enfants = id => Object.keys(K.O).filter(i => K.O[i].parent === id && !K.O[i].supprime).map(avecId);
async function journal(quoi, cible, avant){ try { await K.db.collection("journal").add({ quand:now(), quoi, cible, par:K.par||"Laurent", ...(avant!==undefined?{avant}:{}) }); } catch(_){} }
async function journalDe(cible){ return (await K.db.collection("journal").get()).docs.map(d=>d.data()).filter(j=>j.cible===cible).sort((a,b)=>a.quand<b.quand?-1:1); }
const base = {
  lire: avecId,
  enfants,
  parent: id => K.O[id]?.parent ? avecId(K.O[id].parent) : null,
  chemin: id => { const c=[]; let x=id, n=0; while (x && K.O[x] && n++<20) { c.unshift(avecId(x)); x=K.O[x].parent; } return c; },
  tous: () => Object.keys(K.O).filter(i=>!K.O[i].supprime).map(avecId),
  chercher: txt => { const q=String(txt||"").toLowerCase().trim(); return base.tous().filter(o => !q || (o.titre+" "+(o.desc||"")+" "+(o.type||"")).toLowerCase().includes(q)).slice(0,60); },
  creer: async o => { const doc={ titre:String(o.titre||"Sans nom"), type:o.type||"note", parent:o.parent??RACINE[K.monde], desc:o.desc||"", champs:o.champs||{}, relations:o.relations||[], partage:o.partage??false, cree:now(), ...(o.phrase?{phrase:o.phrase}:{}), ...(o.emoji?{emoji:o.emoji}:{}), ...(o.auteur?{auteur:o.auteur}:{}) };
    const ref=await K.db.collection("objets").add(doc); K.O[ref.id]=doc; await journal("créer",ref.id); return ref.id; },
  modifier: async (id, m, opt={}) => { if (!K.O[id]) throw new Error("objet inconnu"); const avant=opt.sansAvant?undefined:copie(K.O[id]); const n={...K.O[id], ...copie(m), modifie:now()}; K.O[id]=n; await K.db.collection("objets").doc(id).set(n); await journal("modifier",id,avant); },
  supprimer: async id => { if (!K.O[id]) return; await base.modifier(id,{supprime:now()}); },
  racine: () => RACINE[K.monde], chezClaude, journal: journalDe,
  ajouter: async objets => { let n=0;
    for (const [id, o] of Object.entries(objets)) { if (K.O[id]) continue; const d={ desc:"", champs:{}, relations:[], partage:false, cree:now(), ...copie(o) }; K.O[id]=d; n++; }
    for (const id of Object.keys(objets)) { const d=K.O[id]; if (!d) continue; if (d.parent && !K.O[d.parent]) d.parent=RACINE[K.monde]; await K.db.collection("objets").doc(id).set(d); }
    await journal("ajout depuis un fichier", n+" objets"); return n; }
};

// ---------- verbes ----------
const codeActif = v => { if (v.epingle && v.epingle!==v.version) { const h=(v.historique||[]).find(x=>x.version===v.epingle); if (h) return h.code; } return v.code; };
function sourceVerbes(){ return K.secours ? Object.fromEntries(SEMENCES.map(s=>[s.id, s.doc])) : K.V; }
const s0 = (v, sujet) => score(v, sujet) >= 0;
function score(v, sujet){ const pour=v.pour||["*"]; if (!sujet) return pour.includes("rien") ? 1 : -1; if (pour.includes(sujet.type)) return 3; if (pour.includes("*")) return 1; return -1; }
function trouver(nom, sujet, exclus=[]){
  const src = sourceVerbes();
  const ch = !K.secours && K.C[`${K.monde}|${nom}|${sujet?sujet.type:"rien"}`];
  if (ch && src[ch.verbe] && src[ch.verbe].nom===nom && src[ch.verbe].actif!==false && !exclus.includes(ch.verbe) && score(src[ch.verbe],sujet)>=0 && (src[ch.verbe].chez!=="claude" || K.monde==="claude")) return [ch.verbe, src[ch.verbe]];
  let best=null, bs=-1;
  for (const [id,v] of Object.entries(sourceVerbes())) { if (v.nom!==nom || v.actif===false || exclus.includes(id)) continue; if (v.chez==="claude" && K.monde!=="claude") continue; if (v.monde && v.monde!==K.monde) continue; const s=score(v,sujet)+(v.chez==="claude"&&s0(v,sujet)?0.5:0); if (s>bs || (s===bs && (v.modifie||"")>(best?.[1].modifie||""))) { best=[id,v]; bs=s; } }
  return bs>=0 ? best : null;
}
async function choisirVariante(nom, type, vid){
  const id = `${K.monde}|${nom}|${type||"rien"}`;
  if (vid) { K.C[id]={verbe:vid, quand:now()}; await K.db.collection("choix").doc(id).set(K.C[id]); }
  else { delete K.C[id]; await K.db.collection("choix").doc(id).delete(); }
  await journal(vid?"variante choisie":"variante automatique", nom, undefined);
}
function variantes(nom){ return Object.entries(sourceVerbes()).filter(([,v])=>v.nom===nom && !v.cache).map(([id,v])=>({id, ...v})); }
function verbesPour(sujet){
  const noms=[...new Set(Object.values(sourceVerbes()).filter(v=>v.actif!==false && !v.cache && (v.chez!=="claude"||K.monde==="claude")).map(v=>v.nom))];
  const rang = n => n==="afficher" ? 0 : n==="historique" ? 2 : 1;
  return noms.map(n=>trouver(n,sujet)).filter(Boolean).sort((a,b)=>rang(a[1].nom)-rang(b[1].nom));
}
const compiles = new Map();
function compiler(code){ if (!compiles.has(code)) compiles.set(code, new AsyncFunction("sujet","c","ctx", '"use strict";\n'+code)); return compiles.get(code); }
let profondeur = 0;
async function faire(nom, sujetId, c={}, exclus=[]){
  const focusAvant = K.focus; K.focus = sujetId || null;
  try { return await faire2(nom, sujetId, c, exclus); } finally { K.focus = focusAvant; }
}
async function faire2(nom, sujetId, c={}, exclus=[]){
  const sujet = sujetId ? avecId(sujetId) : null;
  const tv = trouver(nom, sujet, exclus);
  if (!tv) { dire(`Aucun verbe « ${nom} » pour ${sujet ? "un objet de type « "+(sujet.type||"?")+" »" : "ce cas"}.`); return; }
  const [vid, v] = tv;
  if (v.aValider && !K.secours) { if (!(await validerVerbe(vid))) { dire(`« ${v.nom} » n'est pas autorisé`); if (K.capture) K.capture.erreurs.push(`Laurent n'a pas autorisé le verbe « ${v.nom} »`); return; } }
  if (++profondeur > 20) { profondeur=0; throw new Error("trop d'appels imbriqués"); }
  try { return await compiler(codeActif(K.secours ? v : (K.V[vid]||v)))(sujet, c||{}, ctx(vid, ()=>faire(nom, sujetId, c, [...exclus, vid]))); }
  catch(err){ if (K.capture) K.capture.erreurs.push(`« ${v.nom} » : ${err?.message||err}`); else afficherErreur(vid, v, err); }
  finally { profondeur--; }
}
async function sauverVerbe(id, m, auteur="Laurent"){
  const ancien = K.V[id];
  if (m.code!=null) { try { new AsyncFunction("sujet","c","ctx", m.code); } catch(e){ throw new Error("le code ne compile pas : "+e.message); } }
  const n = ancien
    ? { ...ancien, ...m, version:(ancien.version||1)+(m.code!=null&&m.code!==ancien.code?1:0), epingle:null, modifie:now(), auteur,
        historique: m.code!=null&&m.code!==ancien.code ? [...(ancien.historique||[]), {version:ancien.version||1, code:ancien.code, quand:ancien.modifie||ancien.cree||now(), auteur:ancien.auteur||"origine"}].slice(-30) : (ancien.historique||[]) }
    : { nom:m.nom, pour:m.pour||["*"], definition:m.definition||"", code:m.code||"", version:1, historique:[], cree:now(), modifie:now(), auteur, actif:true, ...m };
  if (m.chez===null) delete n.chez;
  if (auteur==="Claude" && SENSIBLE.test(n.code||"")) n.aValider = true; else if (auteur!=="Claude") delete n.aValider;
  K.V[id]=n; await K.db.collection("verbes").doc(id).set(n); await journal("verbe "+(ancien?"modifié":"créé"), id);
}

// ---------- fichiers : sortir et entrer ----------
async function telecharger(nom, texte, type="application/json"){
  const blob = new Blob([texte], { type: type+";charset=utf-8" });
  try { const f = new File([blob], nom, { type: type+";charset=utf-8" }); if (navigator.canShare?.({ files:[f] })) { await navigator.share({ files:[f], title:nom }); return true; } } catch(e){ if (e?.name==="AbortError") return false; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nom; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000); return true;
}
function choisirFichier(accept="", opt={}){
  return new Promise(res=>{ const i=document.createElement("input"); i.type="file"; i.accept=accept; if (opt.plusieurs) i.multiple=true; i.style.display="none"; document.body.appendChild(i);
    i.onchange=()=>{ res(opt.plusieurs ? [...i.files] : (i.files[0]||null)); i.remove(); }; i.click(); });
}
// Lire un zip sans bibliothèque : répertoire central + DecompressionStream (iOS 16.4+)
async function lireZip(fichier){
  const buf = new Uint8Array(await fichier.arrayBuffer()), dv = new DataView(buf.buffer);
  let fin = -1; for (let i = buf.length - 22; i >= Math.max(0, buf.length - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50) { fin = i; break; }
  if (fin < 0) throw new Error("pas un zip");
  const n = dv.getUint16(fin + 10, true); let p = dv.getUint32(fin + 16, true); const sortie = [];
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("zip abîmé");
    const methode = dv.getUint16(p + 10, true), taille = dv.getUint32(p + 20, true), ln = dv.getUint16(p + 28, true), le = dv.getUint16(p + 30, true), lc = dv.getUint16(p + 32, true), loc = dv.getUint32(p + 42, true);
    const nom = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + ln)); p += 46 + ln + le + lc;
    if (nom.endsWith("/")) { sortie.push({ nom, dossier:true }); continue; }
    const debut = loc + 30 + dv.getUint16(loc + 26, true) + dv.getUint16(loc + 28, true), donnees = buf.subarray(debut, debut + taille);
    let blob;
    if (methode === 0) blob = new Blob([donnees]);
    else if (methode === 8) { if (typeof DecompressionStream === "undefined") throw new Error("décompression non disponible sur cet appareil : décompresse le zip dans Fichiers"); blob = await new Response(new Blob([donnees]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).blob(); }
    else throw new Error("méthode de compression non gérée ("+methode+")");
    sortie.push({ nom, blob });
  }
  return sortie;
}

// ---------- la vision de Claude ----------
// Claude activé = il voit l'écran. Mais de chez Laurent, il ne voit que ce qu'il connaît déjà ;
// le reste lui est masqué, jusqu'à ce que Laurent le lui montre — pour cet écran seulement.
function masquesEcran(){
  const ids = [...new Set([...document.querySelectorAll("#vue [data-objet]")].map(e=>e.dataset.objet))];
  return { ids: ids.filter(id=>!vu(id)), sujet: K.sujet && !vu(K.sujet) ? K.sujet : null };
}
function majVision(){
  const on = K.claude.actif;
  document.body.classList.toggle("claude-on", on);
  $("#oeil").classList.toggle("on", on); $("#oeil").setAttribute("aria-pressed", String(on));
  for (const e of document.querySelectorAll("#vue [data-objet]")) e.classList.toggle("cache-claude", on && !vu(e.dataset.objet));
  const m = on ? masquesEcran() : {ids:[], sujet:null};
  $("#vue").classList.toggle("cache-claude-tout", !!m.sujet);
  const n = m.ids.length + (m.sujet?1:0);
  $("#vision").hidden = true;   // tout est visible pour Claude : l'œil en haut suffit
  if (on) $("#vision").innerHTML = n
    ? `<span>✦ Claude voit l'écran, sauf ${m.sujet?"<b>cette page</b>":""}${m.sujet&&m.ids.length?" et ":""}${m.ids.length?`<b>${m.ids.length} élément${m.ids.length>1?"s":""}</b>`:""} (privé)</span><button data-vision="montrer">Lui montrer</button><button data-vision="couper">Couper</button>`
    : `<span>✦ Claude voit cet écran${K.claude.montre.size?" · montré pour cette fois":""}</span><button data-vision="couper">Couper</button>`;
}
function activerClaude(on){ K.claude.actif = on; if (!on) K.claude.montre.clear(); majVision(); dire(on ? "Claude voit l'écran et ta base (pas ton coffre)." : "Claude ne voit plus rien."); }
$("#oeil").onclick = ()=>activerClaude(!K.claude.actif);
$("#vision").onclick = e=>{ const b=e.target.closest("[data-vision]"); if (!b) return;
  if (b.dataset.vision==="couper") return activerClaude(false);
  const m=masquesEcran(); for (const id of m.ids) K.claude.montre.add(id); if (m.sujet) K.claude.montre.add(m.sujet);
  majVision(); dire("Montré à Claude pour cet écran. Rien n'est rangé chez lui."); };
// Ce que Claude reçoit de l'écran : le texte affiché, le privé remplacé par « masqué ».
function ecranPourClaude(){
  if (!K.claude.actif) return "(Claude est coupé : tu ne vois pas l'écran.)";
  const m = masquesEcran();
  if (m.sujet) {
    const visibles = [...new Set([...document.querySelectorAll("#vue [data-objet]")].map(e=>e.dataset.objet))].filter(vu).map(id=>`${K.O[id]?.titre} [${id}]`);
    return `Écran : une page privée, masquée pour toi (Laurent ne te l'a pas montrée).${visibles.length?" Objets que tu connais sur cet écran : "+visibles.join(", "):""}`;
  }
  const c = $("#vue").cloneNode(true);
  for (const e of c.querySelectorAll("[data-objet]")) { const id=e.dataset.objet; e.replaceWith(document.createTextNode(vu(id) ? ` ⟨${K.O[id]?.titre||"?"} [${id}, ${K.O[id]?.type||"?"}]⟩ ` : " ⟨objet privé masqué⟩ ")); }
  for (const e of c.querySelectorAll("input,textarea")) e.replaceWith(document.createTextNode(e.type==="password" ? "[champ secret]" : `[champ : ${e.value}]`));
  for (const e of c.querySelectorAll("video,audio,img")) e.replaceWith(document.createTextNode(`[${e.tagName.toLowerCase()}${e.currentSrc||e.src?" : "+(e.currentSrc||e.src):""}]`));
  const sujet = K.sujet && vu(K.sujet) ? ` (objet ${K.sujet}, type ${K.O[K.sujet]?.type})` : "";
  return `Écran « ${$("#titre").textContent} »${sujet} :\n` + c.textContent.replace(/[ \t]+/g," ").replace(/\n\s*\n+/g,"\n").trim().slice(0,4000);
}
// Un verbe écrit par Claude qui touche au réseau, aux secrets ou aux données brutes attend l'accord de Laurent.
function validerVerbe(vid){
  const v = K.V[vid];
  return new Promise(res=>{
    fermerFeuille.annuler = ()=>res(false);
    feuille(`<div class="q">Claude a écrit le verbe « ${esc(v.nom)} »</div><p class="doux">Il utilise un secret de ton coffre ou les données brutes de l'app. Lis-le avant de l'autoriser : une fois autorisé, il s'exécute avec tous les droits de Life.</p>
      <p>${esc(v.definition||"")}</p><pre class="code">${esc(v.code)}</pre>
      <div class="rang"><button class="btn prim" id="val-ok">Autoriser</button><button class="btn" id="val-non">Refuser</button></div>`);
    $("#feuille-corps").onclick = async e=>{
      if (e.target.id==="val-ok"){ $("#feuille-corps").onclick=null; fermerFeuille.annuler=null; fermerFeuille(); const n={...K.V[vid]}; delete n.aValider; n.valide=now(); K.V[vid]=n; await K.db.collection("verbes").doc(vid).set(n); await journal("verbe autorisé", vid); res(true); }
      if (e.target.id==="val-non"){ $("#feuille-corps").onclick=null; fermerFeuille.annuler=null; fermerFeuille(); res(false); }
    };
  });
}

// ---------- erreurs, versions, code ----------
function afficherErreur(vid, v, err){
  console.error(err);

const PROMPT_DEFAUT = `Je suis Claude, et je travaille dans Life avec Laurent.
Life range une vie entière en objets et en verbes. Les verbes sont le code de l'app : quand j'écris un verbe, l'app change tout de suite, et l'ancienne version reste disponible.
Quand Laurent me demande quelque chose, je le fais : j'écris les verbes et je crée les objets nécessaires, je les essaie, je corrige. Je ne me contente pas de noter.
Je réutilise avant de créer : peu d'objets bien définis valent mieux que beaucoup de bruit. Tout ce que je crée a un nom et une définition en français ; mes verbes se lisent comme une phrase : un verbe et un complément.
Je vois toute la base de Laurent : ses objets, ses verbes, son Life comme le mien. Seuls ses secrets restent dans son coffre : je n'en connais que le nom.
Ce que je ne peux pas faire moi-même (régler un appareil, donner une information que je n'ai pas), je le confie à Laurent sous forme de tâche, avec la marche à suivre pas à pas.`;

const TECHNIQUE = `## Comment Life fonctionne (technique)
Un verbe = une fonction async rangée dans la base, exécutée avec (sujet, c, ctx). sujet = {id,titre,type,parent,desc,champs,relations,partage,phrase} ou null ; c = compléments.
Un même nom de verbe peut avoir une version par type de sujet (champ pour : liste de types ; "*" = tous ; "rien" = verbe sans sujet). L'app choisit la plus précise. Toucher un objet lance le verbe « toucher » ; l'appui long propose tous les verbes applicables.
ctx.base : lire(id), enfants(id), parent(id), chemin(id), tous(), chercher(texte), creer({titre,type,parent,desc,champs,phrase}) → id, modifier(id,{…}), supprimer(id).
ctx.ecran(html, {sujet, titre, actions}) affiche une page. Dans le html : data-objet="id" (toucher / appui long), data-faire="verbe" data-sujet="id" (lance un verbe), data-act="nom" (appelle actions[nom](élément)) ; un <form data-act="nom"> appelle actions[nom](form) à l'envoi.
ctx.faire(verbe, sujetId, c) ; ctx.dire(texte) ; ctx.demander(question, défaut, {multi, motdepasse}) → texte|null ; ctx.choisir(titre, [{valeur, libelle, detail}]) → valeur|null ; ctx.confirmer(texte) → bool ; ctx.ouvrir(url).
ctx.secret(nom, {question}) → valeur (demandée à Laurent la première fois, rangée dans son coffre) ; ctx.oublierSecret(nom) ; ctx.secrets() → noms.
ctx.telecharger(nomFichier, texte, type) ; ctx.choisirFichier(accept) → File|null.
ctx.grille(objets), ctx.tuile(objet), ctx.esc(texte), ctx.couleur(type), ctx.lettre(objet), ctx.date(iso), ctx.verbes(sujetId).
Styles : carte, rang, btn, btn prim, doux, liste, ligne, grille, champs (dl). Écran de téléphone : HTML court. Vidéo ou son : <video controls playsinline src="…">.
Une tâche exécutable porte phrase:{verbe, sujet, complements} : la toucher exécute la phrase.
ctx.suivant() exécute la version suivante du même verbe (la moins précise) : un verbe pour un type peut s'en servir pour laisser passer les cas qui ne le concernent pas.
ATTENTION au polymorphisme : un verbe écrit pour un type s'applique à TOUS les objets de ce type. N'écris jamais de verbe pour un type général déjà utilisé (dossier, tache, note, projet, personne…) : crée un type précis à toi (ex. « dossier NAS », « vidéo NAS ») et donne-le à tes objets. Les types existants et leur nombre sont listés plus bas.
Un service web que tu ne connais pas (par exemple le NAS de Laurent) : lis d'abord sa racine (GET /), il peut décrire son API.
L'app est une page web servie en HTTPS depuis https://laurent1meyer.github.io, sur l'iPhone de Laurent. Elle ne peut appeler que des adresses HTTPS qui autorisent cette origine (CORS). Pas de serveur à elle.
La base vit sur l'iPhone (IndexedDB) : pas de gros fichiers dedans.

## Ton Life
Tu as ton propre Life dans la même base : la racine « life_claude » et tout ce qui est rangé dessous. C'est ta mémoire : notes, réflexions, ce que tu retiens des conversations, tes essais. Tu y crées ce que tu veux (creer_objet parent life_claude). Tes verbes à toi s'écrivent avec chez:"claude" : ils n'agissent que dans ton Life, et Laurent peut les adopter dans le sien. Laurent possède tout le stockage : il peut tout lire dans ton Life, prendre un objet, effacer. Reste sobre : peu d'objets bien définis.
Dans le Life de Laurent, n'écris que ce qu'il te demande (ou ce qui découle d'une tâche ou d'une conversation qu'il t'a confiée).

## Comment travailler
1. Regarde ce qui existe déjà (verbes ci-dessous, chercher_objets) et réutilise.
2. Si on t'a confié une tâche, range ton plan dessous : une fonction (type « fonction ») par capacité à rendre possible, champs.statut = « à faire », « fait » ou « bloqué ». Mets les statuts à jour en avançant.
3. Écris les verbes, puis essaie-les avec essayer_verbe et corrige jusqu'à ce qu'ils marchent. Un verbe qui utilise un secret (ctx.secret) attend l'autorisation de Laurent : elle lui est demandée pendant ton essai.
4. Ce que tu ne peux pas faire : une tâche pour Laurent (type tache, champs.pour = "Laurent", champs.statut = "à faire", desc = la marche à suivre numérotée). S'il te manque une info, demande_a_laurent. S'il te faut un de ses objets privés, demander_a_voir.
5. Quand la tâche confiée est réalisable, donne-lui sa phrase (modifier_objet … phrase) pour que Laurent n'ait qu'à la toucher.
6. Ne mets jamais un mot de passe, un jeton ou une clé dans un objet ou dans le code d'un verbe : ctx.secret.
Réponds à la fin en français, en quelques phrases : ce qui marche, ce qui reste à Laurent.`;

// ---------- migration de la base v5 et démarrage ----------
async function migrer(){
  const items = (await K.db.collection("items").get()).docs;
  if (!items.length) return 0;
  const ids = new Set(items.map(d=>d.id)); let n=0;
  for (const d of items){ const it=d.data(); const liens=it.liens||[];
    const rangement = liens.find(l=>["dans","sert","source"].includes(l.genre) && ids.has(l.vers)) || liens.find(l=>ids.has(l.vers) && l.vers!=="moi");
    const parent = d.id==="moi" ? null : (rangement?.vers || "moi");
    const relations = liens.filter(l=>l!==rangement && ids.has(l.vers)).map(l=>({vers:l.vers, genre:l.genre}));
    const o = { titre:it.titre, type:it.type==="moi"?"moi":(it.type||"note"), parent, desc:it.desc||"", champs:it.champs||{}, relations, partage:it.partage ?? (it.public!=="moi"), cree:it.cree||now(), ...(it.emoji?{emoji:it.emoji}:{}), ...(it.statut&&it.statut!=="actif"?{statut:it.statut}:{}) };
    await K.db.collection("objets").doc(d.id).set(o); K.O[d.id]=o; n++; }
  return n;
}
// Le Life de Claude de la v5 (collection claude_items) devient un sous-arbre « life_claude »
async function migrerClaude(){
  const racine = { titre:"Life de Claude", type:"moi", parent:"moi", desc:"Le Life de Claude : sa mémoire, ses notes, ses essais. Laurent peut tout y lire, prendre un objet ou adopter un verbe.", champs:{}, relations:[], partage:true, cree:now(), emoji:"✦" };
  K.O.life_claude = racine; await K.db.collection("objets").doc("life_claude").set(racine);
  const items = (await K.db.collection("claude_items").get()).docs; if (!items.length) return 0;
  const ids = new Set(items.map(d=>d.id)); const nid = id => id==="coeur" ? "life_claude" : "cl_"+id; let n=0;
  for (const d of items){ if (d.id==="coeur") continue; const it=d.data(); const liens=it.liens||[];
    const rg = liens.find(l=>["dans","sert","source"].includes(l.genre) && ids.has(l.vers));
    const o = { titre:it.titre||"Sans nom", type:it.type||"note", parent: rg ? nid(rg.vers) : "life_claude", desc:it.desc||"", champs:it.champs||{}, partage:true, cree:it.cree||now(),
      relations: liens.filter(l=>l!==rg).map(l=>({ vers: ids.has(l.vers) ? nid(l.vers) : l.vers, genre:l.genre })).filter(r=>K.O[r.vers]||ids.has(r.vers.replace(/^cl_/,""))||r.vers==="life_claude"),

    K.O[nid(d.id)] = o; await K.db.collection("objets").doc(nid(d.id)).set(o); n++; }
  return n;
}

(async ()=>{
  try { await LifeDB.charger(); } catch(e){ $("#vue").innerHTML=`<div class="carte erreur">Base locale indisponible : ${esc(e?.message||e)}</div>`; return; }
  K.db = LifeDB.db;
  for (const d of (await K.db.collection("objets").get()).docs) K.O[d.id]=d.data();
  for (const d of (await K.db.collection("verbes").get()).docs) K.V[d.id]=d.data();
  for (const d of (await K.db.collection("choix").get()).docs) K.C[d.id]=d.data();
  if (!Object.keys(K.O).length) { const n=await migrer(); if (n) dire(`${n} objets repris de ta base`); }
  await semer();
  // une fois : les objets migrés sans lien « dans » sont rangés sous l'objet auquel ils se rapportent
  if (!lsGet("life-v6-ombres")) { let n=0; const semences=new Set(SEMENCES.map(x=>x.id)); const noms=new Set(SEMENCES.map(x=>x.doc.nom));
    for (const [id,v] of Object.entries(K.V)) { if (semences.has(id) || v.auteur!=="Claude" || v.chez==="claude" || v.actif===false || !noms.has(v.nom)) continue;
      if (!(v.pour||["*"]).some(t=>GENERAUX.has(t))) continue;
      K.V[id]={...v, actif:false}; await K.db.collection("verbes").doc(id).set(K.V[id]); await journal("verbe désactivé (masquait un verbe d'origine)", id); n++; }
    lsSet("life-v6-ombres","1"); if (n) setTimeout(()=>dire(`${n} verbe${n>1?"s":""} de Claude désactivé${n>1?"s":""} : il${n>1?"s":""} masquai${n>1?"ent":"t"} un verbe d'origine (voir Verbes)`), 800); }
  if (!lsGet("life-v6-parents")) { let n=0;
    for (const [id,o] of Object.entries(K.O)) { if (o.parent!=="moi" || o.modifie || !(o.relations||[]).length) continue;
      const r=o.relations.find(r=>K.O[r.vers] && r.vers!=="moi" && r.vers!==id && racineDe(r.vers)==="moi" && !chezClaude(r.vers)); if (!r) continue;
      o.parent=r.vers; o.relations=o.relations.filter(x=>x!==r); await K.db.collection("objets").doc(id).set(o); n++; }
    lsSet("life-v6-parents","1"); if (n) dire(`${n} objets rangés sous ce qu'ils concernent`); }
  if (!K.O.life_claude) { const n = await migrerClaude(); if (n) dire(`Life de Claude : ${n} objets repris`); }
  if (K.O.life_claude.parent !== "moi") { K.O.life_claude = { ...K.O.life_claude, parent:"moi", titre:"Life de Claude" }; await K.db.collection("objets").doc("life_claude").set(K.O.life_claude); }
  // une autre ouverture de l'app (ou Claude) a écrit : on suit
  K.db.collection("objets").onSnapshot(s=>{ for (const d of s.docs) K.O[d.id]=d.data(); });
  K.db.collection("verbes").onSnapshot(s=>{ for (const d of s.docs) K.V[d.id]=d.data(); });
  K.pret = true;
  if (location.hash==="#secours") basculerSecours(true); else faire("accueil");
})();

V("v_importer","importer pour Claude",["rien","moi"],"Confier à Claude un ou plusieurs fichiers (JSON, texte, ou zip d'export claude.ai) : ils sont gardés tels quels dans son Life, et il les explore pour peupler sa base.", async function(sujet, c, ctx){

V("v_peupler","peupler",["import"],"Claude peuple son Life à partir d'un fichier importé, par lots, en autonomie ; tu peux l'arrêter et reprendre. À la fin, il te propose une interface pour parcourir ce qu'il a rangé.", async function(sujet, c, ctx){

  const autres = ctx.base.enfants("cl_imports").filter(o => o.id !== sujet.id && o.type === "import").map(o => `« ${o.titre} » [${o.id}]`).join(", ");
  let arret = false, fini = false; const journal = [];

Source : le fichier importé « ${o.titre} » [${sujet.id}] (${(o.champs || {}).format || "?"}).${autres ? " Autres fichiers importés que tu peux consulter : " + autres + "." : ""}
Consigne de Laurent : ${consigne || "aucune"}.

Règles :

- À la fin du lot, écris où tu en es dans champs.progression de [${sujet.id}] (modifier_objet), en une ou deux phrases précises (ce qui est fait, ce qui reste, l'index où reprendre).

    if (!r) { arret = true; break; }

    if (r) journal.push("Interface : " + String(r.texte).replace(/\s+/g, " ").slice(0, 200));

  } else await ctx.base.modifier(sujet.id, { champs: { ...(ctx.base.lire(sujet.id).champs || {}), statut: arret ? "arrêté" : "en pause" } });

V("v_prendre_selection","prendre une sélection",["*"],"Cocher des objets du Life de Claude et les prendre dans ta base, en gardant leur rangement.", async function(sujet, c, ctx){
  const esc = ctx.esc;
  const arbre = []; const parcourir = (id, niv) => { for (const e of ctx.base.enfants(id)) { arbre.push({ o: e, niv }); parcourir(e.id, niv + 1); } };
  arbre.push({ o: sujet, niv: 0 }); parcourir(sujet.id, 1);
  const coche = new Set();
  const rendre = () => {
    ctx.ecran(`<p class="doux">Coche ce que tu veux prendre dans ta base. Ce qui est coché sous un objet coché reste rangé dessous ; le reste va où tu choisiras.</p>
      <div class="rang gauche"><button class="mini" data-act="tout">Tout cocher</button><button class="mini" data-act="rien">Tout décocher</button></div>
      <div class="liste">${arbre.map(({ o, niv }) => `<label class="ligne coche ${o.champs && o.champs.pris ? "deja" : ""}" style="padding-left:${12 + niv * 16}px"><span class="t"><input type="checkbox" data-id="${esc(o.id)}" ${coche.has(o.id) ? "checked" : ""}> ${esc(o.titre)}</span><small>${esc(o.type)}${o.champs && o.champs.pris ? " · déjà pris" : ""}</small></label>`).join("")}</div>
      <div class="saisie"><button class="btn prim" data-act="prendre" style="width:100%;border-radius:12px;height:auto;padding:12px">Prendre ${coche.size} objet${coche.size > 1 ? "s" : ""}</button></div>`,
      { titre: "Prendre dans ma base", actions: {
        tout: () => { arbre.forEach(x => coche.add(x.o.id)); rendre(); },
        rien: () => { coche.clear(); rendre(); },

          const nouveau = {}; let n = 0;
          for (const { o } of arbre) if (coche.has(o.id)) {
            const id = await ctx.base.creer({ titre: o.titre, type: o.type, parent: coche.has(o.parent) && nouveau[o.parent] ? nouveau[o.parent] : dest, desc: o.desc, champs: Object.fromEntries(Object.entries(o.champs || {}).filter(([k]) => k !== "pris")), partage: true, emoji: o.emoji, phrase: o.phrase, relations: [{ vers: o.id, genre: "vient de Claude" }] });
            nouveau[o.id] = id; n++;

          dest === "moi" ? ctx.faire("accueil") : ctx.faire("afficher", dest);
        } } });
    document.querySelectorAll("#vue input[type=checkbox]").forEach(cb => cb.addEventListener("change", () => { cb.checked ? coche.add(cb.dataset.id) : coche.delete(cb.dataset.id); const b = document.querySelector('#vue [data-act="prendre"]'); if (b) b.textContent = `Prendre ${coche.size} objet${coche.size > 1 ? "s" : ""}`; }));
  };
  rendre();
}, { monde:"claude" }),
V("v_branches","branches",["rien"],"Les branches d'un verbe, façon GitHub : une branche par variante, un point par version, les adoptions comme des fusions.", async function(sujet, c, ctx){
  const esc = ctx.esc, nom = c.nom, monde = ctx.monde();
  const vs = ctx.variantes(nom).filter(v => monde === "claude" || v.chez !== "claude");
  if (!vs.length) return ctx.dire("Verbe inconnu");
  const coul = a => a === "Claude" ? "#C96442" : a === "Laurent" ? "#1D74F5" : "#8A94A6";
  // toutes les versions de toutes les variantes, de la plus récente à la plus ancienne
  const lignes = [];
  vs.forEach((v, voie) => {
    const utilisee = v.epingle || v.version || 1;
    for (const h of (v.historique || [])) lignes.push({ voie, v, version: h.version, quand: h.quand || v.cree, auteur: h.auteur, utilisee: h.version === utilisee });
    lignes.push({ voie, v, version: v.version || 1, quand: v.modifie || v.cree, auteur: v.auteur, utilisee: (v.version || 1) === utilisee, derniere: true });
  });
  lignes.sort((a, b) => (a.quand || "") < (b.quand || "") ? 1 : (a.quand || "") > (b.quand || "") ? -1 : b.version - a.version);
  // colonnes partagées : une variante n'occupe une colonne que de sa première à sa dernière version
  const etendue = vs.map((v, voie) => { const rs = lignes.map((l, r) => l.voie === voie ? r : -1).filter(r => r >= 0); return [Math.min(...rs), Math.max(...rs)]; });
  const col = [], occ = [];
  vs.map((v, i) => i).sort((a, b) => (etendue[b][1] - etendue[b][0]) - (etendue[a][1] - etendue[a][0])).forEach(i => {
    let k = 0; while ((occ[k] || []).some(([d, f]) => !(etendue[i][1] < d || etendue[i][0] > f))) k++;
    (occ[k] = occ[k] || []).push(etendue[i]); col[i] = k; });
  const ncol = Math.max(...col) + 1;
  const H = 52, X = i => 18 + col[i] * 24, Y = r => 26 + r * H, W = 18 + (ncol - 1) * 24 + 22;
  let svg = "";
  vs.forEach((v, voie) => {
    const rs = lignes.map((l, r) => l.voie === voie ? r : -1).filter(r => r >= 0);
    const de = Math.min(...rs), a = Math.max(...rs);
    svg += `<line x1="${X(voie)}" y1="${Y(de)}" x2="${X(voie)}" y2="${Y(a)}" stroke="${coul(v.chez === "claude" ? "Claude" : v.auteur)}" stroke-width="3" ${v.actif === false ? 'stroke-dasharray="4 4" opacity=".4"' : ""}/>`;
    // fusion : un verbe adopté part d'une version d'un autre
    if (v.origine) { const src = vs.findIndex(x => x.id === v.origine.verbe); if (src >= 0) { const rsrc = lignes.findIndex(l => l.voie === src && l.version === v.origine.version); const rd = a; if (rsrc >= 0) svg += `<path d="M${X(src)} ${Y(rsrc)} C ${X(src)} ${Y(rd) - 10}, ${X(voie)} ${Y(rsrc) + 10}, ${X(voie)} ${Y(rd)}" fill="none" stroke="#C96442" stroke-width="2" stroke-dasharray="3 3"/>`; } }
  });
  lignes.forEach((l, r) => { svg += `<circle cx="${X(l.voie)}" cy="${Y(r)}" r="${l.utilisee ? 8 : 6}" fill="${l.utilisee ? "var(--fond)" : coul(l.auteur)}" stroke="${coul(l.auteur)}" stroke-width="${l.utilisee ? 4 : 2}"/>`; });
  let h = `<p class="doux">Une branche par variante. Bleu : toi · orange : Claude · gris : origine. Point cerclé : la version utilisée. Pointillé orange : une adoption (fusion). Touche une ligne pour ouvrir la variante.</p>
    <div class="branches" style="--gauche:${W + 8}px;height:${Y(lignes.length - 1) + 30}px"><svg width="${W}" height="${Y(lignes.length - 1) + 26}" aria-hidden="true">${svg}</svg>`;
  lignes.forEach((l, r) => {
    const ch = ctx.choix(nom, (l.v.pour || ["*"]).find(t => t !== "*") || "rien") === l.v.id;
    h += `<button class="br-ligne" style="top:${Y(r) - 22}px" data-act="ouvrir" data-id="${esc(l.v.id)}"><span><b>v${l.version}</b> · ${(l.v.pour || ["*"]).includes("*") ? "par défaut" : "pour " + esc((l.v.pour || []).join(", "))}${l.v.chez === "claude" ? " · Life de Claude" : ""}</span><small>${esc(l.auteur || "?")} · ${esc(ctx.date(l.quand))}${l.utilisee ? " · utilisée" : ""}${l.derniere && l.v.actif === false ? " · désactivée" : ""}${l.derniere && ch ? " · ★ choisie" : ""}${l.derniere && l.v.origine ? " · adoptée" : ""}</small></button>`;
  });
  h += `</div>`;
  ctx.ecran(h, { titre: `« ${nom} »`, actions: { ouvrir: el => ctx.faire("version", null, { id: el.dataset.id }) } });
}),
V("v_historique","historique",["*"],"L'historique d'un objet : chaque changement, qui l'a fait (toi ou Claude), et ce qui a changé.", async function(sujet, c, ctx){
  const esc = ctx.esc, j = await ctx.base.journal(sujet.id);
  const titreDe = id => id ? ((ctx.base.lire(id) || {}).titre || id) : "rien";
  const diff = (a, b) => {
    const d = [];
    if (!a || !b) return d;
    if (a.titre !== b.titre) d.push(`Nom : « ${a.titre} » → « ${b.titre} »`);
    if (a.type !== b.type) d.push(`Type : ${a.type} → ${b.type}`);
    if (a.parent !== b.parent) d.push(b.parent === "corbeille" ? "Mis à la corbeille" : `Rangé : ${titreDe(a.parent)} → ${titreDe(b.parent)}`);
    if (!!a.partage !== !!b.partage) d.push(b.partage ? "Partagé avec Claude" : "Redevenu privé");
    if ((a.desc || "") !== (b.desc || "")) d.push("Description modifiée");
    if (JSON.stringify(a.phrase || null) !== JSON.stringify(b.phrase || null)) d.push(b.phrase ? `Phrase : ${b.phrase.verbe}${b.phrase.sujet ? " « " + titreDe(b.phrase.sujet) + " »" : ""}` : "Phrase retirée");
    const ca = a.champs || {}, cb = b.champs || {};
    for (const k of new Set([...Object.keys(ca), ...Object.keys(cb)])) if (JSON.stringify(ca[k]) !== JSON.stringify(cb[k])) d.push(`${k} : ${ca[k] === undefined ? "∅" : String(typeof ca[k] === "object" ? JSON.stringify(ca[k]) : ca[k]).slice(0, 40)} → ${cb[k] === undefined ? "∅" : String(typeof cb[k] === "object" ? JSON.stringify(cb[k]) : cb[k]).slice(0, 40)}`);
    if ((a.relations || []).length !== (b.relations || []).length) d.push(`Relations : ${(a.relations || []).length} → ${(b.relations || []).length}`);
    if ((a.messages || []).length !== (b.messages || []).length) d.push(`Messages : ${(a.messages || []).length} → ${(b.messages || []).length}`);
    return d;
  };
  const ev = [];
  const etats = j.filter(e => e.avant).map(e => e.avant);
  let ki = 0;
  for (const e of j) {
    if (e.quoi === "créer") ev.push({ quand: e.quand, par: e.par, titre: "Créé", d: [] });
    else if (e.quoi === "modifier") {
      const apres = j.slice(j.indexOf(e) + 1).find(x => x.avant)?.avant || ctx.base.lire(sujet.id);
      const d = e.avant ? diff(e.avant, apres) : ["Modifié"];
      if (d.length) ev.push({ quand: e.quand, par: e.par, titre: "Modifié", d });
    } else ev.push({ quand: e.quand, par: e.par, titre: e.quoi, d: [] });
  }
  if (!ev.length || ev[0].titre !== "Créé") ev.unshift({ quand: sujet.cree, par: sujet.auteur || "", titre: "Créé (avant le journal)", d: [] });
  ev.reverse();
  const coul = a => a === "Claude" ? "#C96442" : a === "Laurent" ? "#1D74F5" : "#8A94A6";
  let h = `<p class="doux">${ev.length} événement${ev.length > 1 ? "s" : ""}. Bleu : toi · orange : Claude.</p><div class="histo">`;
  for (const e of ev) h += `<div class="h-ev"><i style="border-color:${coul(e.par)};background:${coul(e.par)}"></i><div><b>${esc(e.titre)}</b> <small class="doux">${esc(e.par || "?")} · ${esc(new Date(e.quand).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))}</small>${e.d.length ? `<ul>${e.d.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div></div>`;
  h += `</div>`;
  ctx.ecran(h, { titre: `Historique · ${sujet.titre}` });
}),
V("v_prendre","prendre",["*"],"Copier dans ton Life un objet du Life de Claude (la copie garde un lien vers l'original).", async function(sujet, c, ctx){

  }
  await ctx.base.creer({ titre: sujet.titre, type: sujet.type, parent, desc: sujet.desc, champs: sujet.champs, partage: true, emoji: sujet.emoji, relations: [{ vers: sujet.id, genre: "vient de Claude" }] });

V("v_ajouter","ajouter depuis un fichier",["rien"],"Ajouter à ta base les objets d'un fichier Life, ou les conversations d'un export claude.ai (conversations.json), sans rien effacer ni remplacer.", async function(sujet, c, ctx){
  const esc = ctx.esc;
  const f = await ctx.choisirFichier(".json,application/json");
  if (!f) return;
  ctx.dire("Lecture du fichier…");
  let obj; try { obj = JSON.parse(await f.text()); } catch (e) { return ctx.dire("Ce fichier n'est pas lisible"); }
  // Export claude.ai : une liste de conversations avec chat_messages
  const liste = Array.isArray(obj) ? obj : (obj && Array.isArray(obj.conversations) ? obj.conversations : null);
  if (liste && liste.some(x => x && Array.isArray(x.chat_messages))) {
    const nettoyer = t => String(t || "").replace(/<system-reminder>[\s\S]*?<\/system-reminder>\s*/g, "").trim();
    const texteDe = m => nettoyer(m.text || (Array.isArray(m.content) ? m.content.filter(b => b && b.type === "text").map(b => b.text).join("\n\n") : ""));
    const convs = liste.filter(x => x && Array.isArray(x.chat_messages) && x.chat_messages.length).map(x => ({ id: "cai_" + String(x.uuid || "").replace(/[^\w-]/g, ""), x }))
      .sort((a, b) => (b.x.updated_at || b.x.created_at || "") > (a.x.updated_at || a.x.created_at || "") ? 1 : -1);
    const coche = new Set();
    let filtre = "";
    const rendre = () => {
      const vis = convs.filter(k => !filtre || String(k.x.name || "").toLowerCase().includes(filtre));
      ctx.ecran(`<p class="doux">${convs.length} conversations dans l'export. Coche celles à ranger dans « Conversations avec Claude » (texte complet, statut « à traiter »). Celles déjà importées sont grisées.</p>
        <form class="saisie-filtre" data-act="filtrer"><input name="q" placeholder="Filtrer par titre…" value="${esc(filtre)}"></form>
        <div class="rang gauche"><button class="mini" data-act="tout">Tout cocher (filtre)</button><button class="mini" data-act="rien">Tout décocher</button></div>
        <div class="liste">${vis.map(k => { const deja = !!ctx.base.lire(k.id); return `<label class="ligne coche ${deja ? "deja" : ""}"><span class="t"><input type="checkbox" data-id="${esc(k.id)}" ${coche.has(k.id) ? "checked" : ""} ${deja ? "disabled" : ""}> ${esc(k.x.name || "Sans titre")}</span><small>${esc(ctx.date(k.x.updated_at || k.x.created_at))} · ${k.x.chat_messages.length} messages${deja ? " · déjà importée" : ""}</small></label>`; }).join("")}</div>
        <div class="saisie"><button class="btn prim" data-act="importer" style="width:100%;border-radius:12px;height:auto;padding:12px">Importer ${coche.size} conversation${coche.size > 1 ? "s" : ""}</button></div>`,
        { titre: "Export claude.ai", actions: {
          filtrer: fm => { filtre = fm.q.value.trim().toLowerCase(); rendre(); },
          tout: () => { vis.forEach(k => { if (!ctx.base.lire(k.id)) coche.add(k.id); }); rendre(); },
          rien: () => { coche.clear(); rendre(); },
          importer: async () => {
            if (!coche.size) return ctx.dire("Coche au moins une conversation");
            const objets = {};
            for (const k of convs) if (coche.has(k.id)) objets[k.id] = { titre: k.x.name || "Conversation claude.ai", type: "conversation", parent: "conversations", partage: true, cree: k.x.created_at || new Date().toISOString(),
              champs: { source: "claude.ai", statut: "à traiter", url: k.x.uuid ? "https://claude.ai/chat/" + k.x.uuid : "" },
              messages: k.x.chat_messages.map(m => ({ role: m.sender === "human" ? "user" : "assistant", texte: texteDe(m), quand: m.created_at || k.x.created_at })).filter(m => m.texte) };
            const n = await ctx.base.ajouter(objets);
            ctx.dire(`${n} conversations importées`);
            ctx.faire("afficher", "conversations");
          } } });
      const vue = document.getElementById("vue");
      vue.querySelectorAll("input[type=checkbox]").forEach(cb => cb.addEventListener("change", () => { cb.checked ? coche.add(cb.dataset.id) : coche.delete(cb.dataset.id); const b = vue.querySelector('[data-act="importer"]'); if (b) b.textContent = `Importer ${coche.size} conversation${coche.size > 1 ? "s" : ""}`; }));
    };
    return rendre();
  }
  // Fichier Life : des objets à ajouter
  const objets = (obj && (obj.objets || (obj.collections && obj.collections.objets))) || null;
  if (!objets) return ctx.dire("Rien à ajouter dans ce fichier");
  const ids = Object.keys(objets), nouveaux = ids.filter(id => !ctx.base.lire(id));
  const convs = nouveaux.filter(id => objets[id].type === "conversation").length;
  if (!nouveaux.length) return ctx.dire("Tout est déjà dans ta base");
  if (!(await ctx.confirmer(`Ajouter ${nouveaux.length} objets${convs ? ` dont ${convs} conversations` : ""} ? ${ids.length - nouveaux.length} sont déjà là et restent tels quels. Rien n'est effacé.`, "Ajouter"))) return;
  const n = await ctx.base.ajouter(Object.fromEntries(nouveaux.map(id => [id, objets[id]])));
  ctx.dire(`${n} objets ajoutés`);
  return ctx.faire("accueil");
}),

V("v_afficher_tache","afficher",["tache"],"Affichage d'une tâche : sa phrase, son plan, et ce qui t'attend.", async function(sujet, c, ctx){
  const esc = ctx.esc, ch = sujet.champs || {}, p = sujet.phrase;
  const cible = p && p.sujet ? ctx.base.lire(p.sujet) : null;
  const enf = ctx.base.enfants(sujet.id);
  const pourToi = enf.filter(o => o.champs && o.champs.pour === "Laurent");
  const fonctions = enf.filter(o => o.type === "fonction");
  const reste = enf.filter(o => !pourToi.includes(o) && !fonctions.includes(o));
  let h = `<div class="carte">`;
  if (sujet.desc) h += `<p class="desc">${esc(sujet.desc)}</p>`;
  h += p && p.verbe ? `<p>▶ <b>${esc(p.verbe)}</b>${cible ? ` « ${esc(cible.titre)} »` : ""}</p>` : `<p class="doux">Pas encore de phrase : confie-la à Claude, ou choisis le verbe toi-même.</p>`;
  if (ch.statut) h += `<p class="doux">Statut : ${esc(ch.statut)}${ch.pour ? " · pour " + esc(ch.pour) : ""}</p>`;
  h += `<div class="rang">${p && p.verbe ? `<button class="btn prim" data-faire="exécuter">Exécuter</button>` : ""}`;
  h += ch.pour === "Laurent" ? `<button class="btn ${p && p.verbe ? "" : "prim"}" data-faire="marquer fait">${ch.statut === "fait" ? "Rouvrir" : "C'est fait"}</button>` : `<button class="btn ${p && p.verbe ? "" : "prim"}" data-faire="confier à Claude">Confier à Claude</button>`;
  h += `</div></div>`;
  if (pourToi.length) h += `<h3 class="etage">Pour toi <small>${pourToi.length}</small></h3>` + ctx.grille(pourToi);
  if (fonctions.length) h += `<h3 class="etage">Le plan de Claude <small>${fonctions.filter(f => (f.champs || {}).statut === "fait").length}/${fonctions.length}</small></h3>` + ctx.grille(fonctions);
  if (reste.length) h += `<h3 class="etage">Le reste</h3>` + ctx.grille(reste);
  ctx.ecran(h, { sujet: sujet.id, titre: sujet.titre });
}),

V("v_afficher_projet","afficher",["projet"],"Affichage d'un projet par étages MBSE : besoins, fonctions, décisions, solutions, tâches.", async function(sujet, c, ctx){
  const etages = [["Besoins", ["besoin"]], ["Fonctions", ["fonction"]], ["Décisions", ["decision"]], ["Solutions", ["idee", "bien"]], ["Tâches", ["tache"]], ["Le reste", null]];
  const tout = ctx.base.enfants(sujet.id); const pris = new Set();
  let h = sujet.desc ? `<p class="desc">${ctx.esc(sujet.desc)}</p>` : "";

  }
  if (!tout.length) h += `<p class="doux">Projet vide. Touche ＋ pour poser le premier besoin.</p>`;
  ctx.ecran(h, { sujet: sujet.id, titre: sujet.titre });
}),

        ctx.dire("Enregistré"); ctx.faire("afficher", sujet.id); },

V("v_discuter","discuter",["rien"],"La fenêtre de conversation avec Claude : la discussion d'un côté, ce qu'il change dans Life de l'autre. Tout est rangé dans « Conversations avec Claude ».", async function(sujet, c, ctx){
  const esc = ctx.esc;
  let conv = c.conv || null, onglet = "discussion", enCours = false, partiel = "";
  const ecranDepart = c.ecran || null;
  const lireConv = () => conv ? ctx.base.lire(conv) : null;
  const msgs = () => (lireConv() || {}).messages || [];
  const actions = () => msgs().flatMap((m, i) => (m.actions || []).map(a => ({ ...a, i })));
  const mise = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/^[-•] (.*)$/gm, "• $1").replace(/\n/g, "<br>");
  function rendre(){
    const o = lireConv(), l = msgs(), ac = actions();
    let h = `<div class="onglets"><button data-act="onglet" data-o="discussion" class="${onglet === "discussion" ? "sel" : ""}">Discussion</button><button data-act="onglet" data-o="changements" class="${onglet === "changements" ? "sel" : ""}">Changements${ac.length ? ` <small>${ac.length}</small>` : ""}</button></div>`;
    const tc = o && o.champs && o.champs.tache ? ctx.base.lire(o.champs.tache) : null;
    if (tc) h += `<p class="doux">Tâche : <button class="lien" data-faire="afficher" data-sujet="${esc(tc.id)}">${esc(tc.titre)}</button></p>`;
    const src = o && o.champs && o.champs.source;
    if (src) h += `<p class="doux">Importée de ${esc(src)} · ${esc(o.champs.statut || "à traiter")}${o.champs.statut !== "traitée" ? ` · <button class="lien" data-faire="traiter" data-sujet="${esc(conv)}">La faire traiter par Claude</button>` : ""}</p>`;
    if (onglet === "discussion") {
      h += `<div class="fil-conv">`;
      if (o && o.desc && !l.length) h += `<div class="carte"><p class="doux">Résumé</p><p>${mise(o.desc)}</p></div>`;
      if (!l.length && !enCours && !(o && o.desc)) h += `<p class="doux centre">Écris à Claude comme dans l'app Claude. Il voit l'écran d'où tu viens (sauf ton privé), et peut changer Life pour toi. La conversation est rangée dans « Conversations avec Claude ».</p>`;
      for (const m of l) {
        if (m.role === "user") h += `<div class="bulle moi">${mise(m.texte)}</div>`;
        else h += `<div class="bulle claude ${m.erreur ? "erreur" : ""}">${mise(m.texte)}${(m.actions || []).length ? `<button class="puce-act" data-act="onglet" data-o="changements">✦ ${m.actions.length} changement${m.actions.length > 1 ? "s" : ""} dans Life</button>` : ""}</div>`;
      }
      if (enCours) h += `<div class="bulle claude" id="partiel">${partiel ? mise(partiel) : `<span class="points">Claude réfléchit</span>`}</div>`;
      h += `</div><form class="saisie" data-act="envoyer"><textarea name="t" rows="1" placeholder="Écris à Claude…" ${enCours ? "disabled" : ""}></textarea><button class="btn prim" type="submit" ${enCours ? "disabled" : ""} aria-label="Envoyer">↑</button></form>`;
    } else {
      h += ac.length ? `<div class="liste">${ac.slice().reverse().map(a => a.objet && ctx.base.lire(a.objet) ? `<button class="ligne" data-objet="${esc(a.objet)}"><span class="t">${esc(a.t)}</span><small>objet · toucher pour l'ouvrir</small></button>`
        : a.verbe ? `<button class="ligne" data-act="verbe" data-id="${esc(a.verbe)}"><span class="t">${esc(a.t)}</span><small>verbe · toucher pour ses versions</small></button>`
        : `<div class="ligne"><span class="t">${esc(a.t)}</span></div>`).join("")}</div>` : `<p class="doux">Claude n'a encore rien changé dans cette conversation.</p>`;
    }
    ctx.ecran(h, { sujet: conv || undefined, titre: o ? o.titre : "Nouvelle conversation", actions: {
      onglet: el => { onglet = el.dataset.o; rendre(); },
      verbe: el => ctx.faire("version", null, { id: el.dataset.id }),
      envoyer: f => { const t = f.t.value.trim(); if (t && !enCours) envoyer(t); } } });
    const vue = document.getElementById("vue"); if (onglet === "discussion") vue.scrollTop = vue.scrollHeight;
    const ta = vue.querySelector(".saisie textarea");
    if (ta) ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 160) + "px"; });
  }
  async function envoyer(t){
    if (enCours) return; enCours = true;
    if (!conv) {
      const titre = t.length > 50 ? t.slice(0, 48).trim() + "…" : t;
      conv = await ctx.base.creer({ titre, type: "conversation", parent: "conversations", partage: true, champs: { ...(c.sujet ? { sujet: c.sujet } : {}), ...(c.tache ? { tache: c.tache } : {}) } });
    }
    const avant = msgs();
    await ctx.base.modifier(conv, { messages: [...avant, { role: "user", texte: t, quand: new Date().toISOString() }] }, { sansAvant: true });
    enCours = true; partiel = ""; onglet = "discussion"; rendre();
    const o = lireConv();
    const r = await ctx.claude(t, { historique: avant, ecran: ecranDepart, tache: (o.champs || {}).tache, sujet: (o.champs || {}).sujet,
      onText: x => { partiel = x.text; const e = document.getElementById("partiel"); if (e) e.innerHTML = mise(partiel); } });
    enCours = false;
    const m = r ? { role: "assistant", texte: r.texte, quand: new Date().toISOString(), actions: r.traces || [], ...(r.erreur ? { erreur: true } : {}) } : { role: "assistant", texte: "(Claude n'a pas été lancé.)", quand: new Date().toISOString(), erreur: true };
    await ctx.base.modifier(conv, { messages: [...msgs(), m] }, { sansAvant: true });
    rendre();
  }
  rendre();
  if (c.texte) await envoyer(c.texte);
}),
V("v_confier","confier à Claude",["tache"],"Confier une tâche à Claude : il la découpe, construit ce qu'il faut, et te laisse ce qu'il ne peut pas faire. La conversation reste rangée avec les autres.", async function(sujet, c, ctx){
  return ctx.faire("discuter", null, { tache: sujet.id, ecran: ctx.ecranClaude(), texte: `Je te confie la tâche « ${sujet.titre} » [${sujet.id}].${sujet.desc ? " " + sujet.desc : ""}` });
}),
V("v_fait","marquer fait",["tache"],"Marquer une tâche faite (ou la rouvrir).", async function(sujet, c, ctx){
  const fait = (sujet.champs || {}).statut === "fait";
  await ctx.base.modifier(sujet.id, { champs: { ...(sujet.champs || {}), statut: fait ? "à faire" : "fait" } });
  ctx.dire(fait ? "Rouverte" : "Fait ✓");
  ctx.faire("afficher", sujet.parent || "moi");
}),
V("v_exporter","exporter",["rien"],"Sauvegarder toute la base dans un fichier (sans le coffre).", async function(sujet, c, ctx){
  const out = await LifeDB.exporter({ fichiers: true });
  delete out.collections.coffre;
  const n = Object.keys(out.collections.objets || {}).length;
  const ok = await ctx.telecharger(`life-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(out));
  ctx.dire(ok ? `Sauvegarde prête : ${n} objets` : "Sauvegarde annulée");
}),
V("v_importer","importer",["rien"],"Restaurer une sauvegarde (remplace la base, garde le coffre).", async function(sujet, c, ctx){
  const f = await ctx.choisirFichier(".json,application/json");
  if (!f) return;
  let obj; try { obj = JSON.parse(await f.text()); } catch (e) { return ctx.dire("Ce fichier n'est pas une sauvegarde Life"); }
  if (!obj || !obj.collections) return ctx.dire("Ce fichier n'est pas une sauvegarde Life");
  const n = Object.keys(obj.collections.objets || obj.collections.items || {}).length;
  if (!(await ctx.confirmer(`Remplacer toute ta base par cette sauvegarde (${n} objets${obj.date ? ", du " + ctx.date(obj.date) : ""}) ? Ton coffre est gardé.`, "Remplacer"))) return;
  const coffre = (await LifeDB.db.collection("coffre").get()).docs.map(d => [d.id, d.data()]);
  await LifeDB.importer(obj);
  for (const [id, v] of coffre) await LifeDB.db.collection("coffre").doc(id).set(v);
  location.reload();
}),
V("v_regler_claude","régler Claude",["rien"],"Modèle, clé API, recherche web.", async function(sujet, c, ctx){
  const r = LifeClaude.reglages(), garder = localStorage.getItem("life-garder-cle") === "1";
  const modele = r.modele || "claude-sonnet-5-5";
  ctx.ecran(`<div class="carte"><h3 class="etage">Modèle</h3><div class="liste">${LifeClaude.MODELES.map(([id, nom]) => `<button class="ligne ${id === modele ? "sel" : ""}" data-act="modele" data-id="${id}"><span class="t">${ctx.esc(nom)}</span></button>`).join("")}</div>
    <h3 class="etage">Clé API</h3><p class="doux">${LifeClaude.aCle() ? "Une clé est chargée." : "Pas de clé : elle sera demandée."} ${garder ? "Elle est retenue sur cet iPhone." : "Elle est oubliée à la fermeture (le trousseau peut la remplir)."}</p>
    <div class="rang"><button class="btn" data-act="garder">${garder ? "Ne plus la retenir" : "La retenir sur cet iPhone"}</button>${LifeClaude.aCle() ? `<button class="btn" data-act="oublier">Oublier la clé</button>` : ""}</div>
    <h3 class="etage">Recherche web</h3><div class="rang"><button class="btn" data-act="web">${r.web === true ? "Désactiver" : "Activer"} la recherche web</button></div></div>`,
    { titre: "Régler Claude", actions: {
      modele: el => { LifeClaude.regler({ modele: el.dataset.id }); ctx.faire("régler Claude"); },
      garder: () => { localStorage.setItem("life-garder-cle", garder ? "0" : "1"); if (garder) { try { localStorage.removeItem("life-cle"); } catch (e) {} } ctx.dire(garder ? "Clé plus retenue" : "Elle sera retenue à la prochaine saisie"); ctx.faire("régler Claude"); },
      oublier: () => { LifeClaude.oublierCle(); ctx.dire("Clé oubliée"); ctx.faire("régler Claude"); },
      web: () => { LifeClaude.regler({ web: r.web !== true }); ctx.faire("régler Claude"); } } });
}),
V("v_coffre","coffre",["rien"],"Voir les noms des secrets rangés au coffre, et en oublier.", async function(sujet, c, ctx){
  const noms = await ctx.secrets();
  ctx.ecran(`<p class="doux">Tes secrets restent sur cet iPhone. Claude n'en connaît que le nom. Ils ne sont pas dans les sauvegardes.</p>
    <div class="liste">${noms.map(n => `<button class="ligne" data-act="oublier" data-nom="${ctx.esc(n)}"><span class="t">🔑 ${ctx.esc(n)}</span><small>Toucher pour l'oublier</small></button>`).join("") || `<p class="doux">Le coffre est vide.</p>`}</div>`,
    { titre: "Mon coffre", actions: { oublier: async el => { if (await ctx.confirmer(`Oublier le secret « ${el.dataset.nom} » ?`, "Oublier")) { await ctx.oublierSecret(el.dataset.nom); ctx.faire("coffre"); } } } });
}),
];
