<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1524">
<title>Life · version</title>
<style>
html,body{margin:0;height:100%;background:#0F1524;color:#EEF2FA;font:16px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}
.doux{color:#97A3BA;font-size:14px}a{color:#4C93FF}
</style>
</head>
<body>
<div id="msg"><p>Chargement de la version…</p><p class="doux" id="detail"></p></div>
<script>
// Ouvre une version passée (ou une branche) de Life : son code est lu sur GitHub, puis exécuté ici,
// sur la même origine, donc avec la même base que la version du jour.
(async () => {
  const q = new URLSearchParams(location.search);
  const sha = (q.get("sha") || "").replace(/[^0-9a-f]/gi, ""), fichier = (q.get("f") || "life/v6.html").replace(/[^\w./-]/g, "");
  const echec = t => { document.getElementById("msg").innerHTML = `<p>Impossible d'ouvrir cette version.</p><p class="doux">${t}</p><p><a href="./">Revenir au lanceur</a></p>`; };
  if (!sha) return echec("Version non précisée.");
  document.getElementById("detail").textContent = fichier + " @ " + sha.slice(0, 7);
  let html;
  try {
    const r = await fetch(`https://api.github.com/repos/Laurent1meyer/assistant-personnel/contents/${fichier}?ref=${sha}`, { headers: { Accept: "application/vnd.github.raw" } });
    if (r.status === 403 || r.status === 429) return echec("GitHub limite les lectures (60 par heure) : réessaie un peu plus tard.");
    if (!r.ok) return echec("GitHub répond " + r.status + ".");
    html = await r.text();
  } catch (e) { return echec("Pas de réseau : une version passée se charge depuis GitHub."); }
  // repère visible : on n'est pas sur la version du jour
  const bandeau = `<div style="position:fixed;right:8px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:99999;background:#C96442;color:#fff;font:600 11px -apple-system,system-ui,sans-serif;padding:3px 8px;border-radius:10px;pointer-events:none;opacity:.92">Version ${sha.slice(0, 7)} — pas la version du jour</div>`;
  html = html.replace(/<\/body>/i, bandeau + "</body>");
  document.open(); document.write(html); document.close();
})();
</script>
</body>
</html>
