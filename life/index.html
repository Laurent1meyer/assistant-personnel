@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1524; --surface:#18213A; --surface2:#222D4A; --ink:#E7EDF8; --muted:#9AA7C0; --line:#2C3858;
  --accent:#4C95FF; --accent-ink:#0B1222; --ok:#34C08F; --no:#F06A6A;
  --claude:#E08A66; --claude-soft:#3A2620; --claude-ink:#1A0F0B; --blanc:#EEF2F8; --blanc-bord:#8090A8;
  --space-bg:#070C18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1524; --surface:#18213A; --surface2:#222D4A; --ink:#E7EDF8; --muted:#9AA7C0; --line:#2C3858;
  --accent:#4C95FF; --accent-ink:#0B1222; --ok:#34C08F; --no:#F06A6A;
  --claude:#E08A66; --claude-soft:#3A2620; --claude-ink:#1A0F0B; --blanc:#EEF2F8; --blanc-bord:#8090A8;
  --space-bg:#070C18; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto auto 1fr;max-width:900px;margin:0 auto;position:relative;overflow:hidden}
#app.voit{box-shadow:inset 0 0 0 3px var(--claude)}

header.top{display:flex;align-items:center;gap:10px;padding:10px 16px 4px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;border:0;padding:0;cursor:pointer;flex:none;background:var(--icone-life, #0b0a18) center/cover #0b0a18;box-shadow:0 2px 6px -2px rgba(0,0,0,.45)}
.fil{display:flex;align-items:center;gap:2px 4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;white-space:nowrap}
.fil::-webkit-scrollbar{display:none}
.fil button{border:0;background:none;color:var(--accent);padding:6px 2px;cursor:pointer;font-weight:700;font-size:15px}
.fil button[aria-current="page"]{color:var(--ink);font-family:var(--f-display);font-size:19px;cursor:default}
.fil span{color:var(--muted)}
.pill-voit{flex:none;font-size:12px;font-weight:700;color:var(--claude-ink);background:var(--claude);padding:4px 9px;border-radius:999px}

.lentilles{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 16px 8px}
.lentilles::-webkit-scrollbar{display:none}
.lentilles button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.lentilles button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.lentilles button.claude{border-style:dashed}
.lentilles button.plus{color:var(--accent);font-weight:700}

main#vue{position:relative;min-height:0;overflow:hidden}
#vue-html{height:100%;overflow-y:auto;padding:6px 16px 120px;box-sizing:border-box;touch-action:pan-y}
#vue-espace{position:absolute;inset:0;background:var(--space-bg)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.esp-ctrl{position:absolute;left:12px;right:12px;top:10px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.esp-ctrl>*{pointer-events:auto}
.esp-info{position:absolute;left:12px;right:12px;bottom:96px;color:#9FB0CF;font-size:12px;text-align:center;pointer-events:none}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.esp-ctrl .seg{background:rgba(255,255,255,.1)}
.esp-ctrl .seg button{color:var(--space-ink)}
.esp-ctrl .seg button[aria-pressed="true"]{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}

/* tuiles façon iPhone */
.grille{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 8px;padding-top:6px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;padding:0;min-width:0;position:relative}
.tuile{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;position:relative;color:#fff;font-family:var(--f-display);font-weight:700;font-size:23px;box-shadow:0 6px 14px -8px rgba(10,30,70,.45);box-sizing:border-box}
.tuile.dossier{background:var(--surface2);padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;place-items:stretch}
.tuile.dossier i{border-radius:4px;display:block}
.tuile.creux{background:transparent!important;box-shadow:inset 0 0 0 2.5px var(--c,var(--muted));color:var(--c,var(--muted))}
.tuile.blanc{background:var(--blanc)!important;box-shadow:inset 0 0 0 1.5px var(--blanc-bord),0 6px 14px -8px rgba(10,30,70,.35);color:#3A475E}
.tuile.blanc.dossier i{opacity:.85}
.tuile.masque{background:var(--surface2)!important;box-shadow:none;color:var(--muted);filter:blur(1.2px)}
.ic .lab{font-size:12px;line-height:1.2;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ic .lab.flou{filter:blur(4px);user-select:none}
.nb{position:absolute;bottom:-6px;right:-6px;background:var(--surface);color:var(--ink);box-shadow:0 0 0 1.5px var(--line);font:700 11px/1 var(--f-body);padding:4px 6px;border-radius:999px;font-variant-numeric:tabular-nums}
.prive{position:absolute;top:-5px;left:-5px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg);font-size:10px}
.desc{line-height:1.5;margin:4px 0 12px;color:var(--muted)}
.vide{padding:14px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);line-height:1.45;margin-top:14px}
.legende{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:22px 0 0}
.legende span{display:inline-flex;align-items:center;gap:6px}
.legende i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* Temps */
.jour{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.jour .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;line-height:1.25}
.jour .d b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink)}
.evts{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.pastille{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px 5px 7px;background:var(--surface);border:1px solid var(--line);font-size:13px;cursor:pointer;max-width:100%;min-width:0}
.pastille span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pastille.blanc{background:var(--blanc);color:#3A475E;border-color:var(--blanc-bord)}
.pastille.creux{background:transparent;border-style:dashed}
.pt{width:10px;height:10px;border-radius:50%;flex:none}

/* Étages */
.etage{margin:0 0 16px}
.etage h3{font-family:var(--f-display);font-size:16px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.etage h3 small{color:var(--muted);font:400 12.5px var(--f-body)}
.rangee{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.carte-obj{flex:none;width:150px;border-radius:14px;padding:10px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;display:grid;gap:6px}
.carte-obj b{font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.carte-obj small{color:var(--muted);font-size:11.5px}
.carte-obj.blanc{background:var(--blanc);color:#3A475E;border-color:var(--blanc-bord)}
.carte-obj.masque{filter:blur(2.5px)}

/* Carte */
.carte-geo{position:relative;width:100%;max-width:520px;aspect-ratio:1;margin:8px auto 0;border-radius:50%;background:radial-gradient(circle,var(--surface) 0 30%,var(--surface2) 30.5% 31%,var(--surface) 31.5% 63%,var(--surface2) 63.5% 64%,var(--surface) 64.5% 99%);border:1px solid var(--line)}
.carte-geo .pt-geo{position:absolute;transform:translate(-50%,-50%);border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;max-width:110px}
.carte-geo .pt-geo i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.carte-geo .anneau{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}

/* Feuille (fiche, réglages) */
#voile{position:fixed;inset:0;background:rgba(8,14,30,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#voile.on{opacity:1;pointer-events:auto}
#fiche{position:fixed;left:0;right:0;bottom:0;max-width:900px;margin:0 auto;max-height:84%;background:var(--surface);border-radius:22px 22px 0 0;z-index:31;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px -10px rgba(0,0,0,.35)}
#fiche.on{transform:none}
.poignee{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px;flex:none}
#fiche .corps{overflow-y:auto;padding:6px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.f-tete{display:flex;gap:12px;align-items:flex-start}
.f-tete .av{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font:700 20px var(--f-display);flex:none;box-sizing:border-box}
.f-tete .av.rond{border-radius:50%}
.f-tete h3{font-family:var(--f-display);font-size:21px;line-height:1.2;margin:2px 0 6px;text-wrap:balance}
.x{margin-left:auto;border:0;background:var(--surface2);width:36px;height:36px;border-radius:50%;cursor:pointer;flex:none;font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:700}
.chip.claude{background:var(--claude-soft);color:var(--claude)}
.pourquoi{margin:14px 0 4px;padding:10px 12px;border-left:3px solid var(--claude);background:var(--claude-soft);border-radius:0 12px 12px 0;font-size:14px;line-height:1.45}
.kv{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:6px 14px;margin:14px 0 0;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv a{color:var(--accent)}
.bloc{margin-top:18px}
.bloc h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.ligne{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--bg);margin-bottom:6px;cursor:pointer;min-width:0;border:1.5px solid transparent}
.ligne.blanc{background:var(--blanc);color:#3A475E;border-color:var(--blanc-bord)}
.ligne.masque .t{filter:blur(4px)}
.ligne .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne .g{font-size:12px;color:var(--muted);flex:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:999px;padding:9px 15px;font-weight:700;cursor:pointer;background:var(--surface2);min-height:40px}
.btn.prim{background:var(--accent);color:var(--accent-ink)}
.btn.claude{background:var(--claude);color:var(--claude-ink)}
.btn.no{background:transparent;color:var(--no);box-shadow:inset 0 0 0 1.5px var(--no)}
.interr{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--bg);margin-top:14px;cursor:pointer}
.interr input{width:44px;height:26px;appearance:none;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.interr input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.interr input:checked{background:var(--claude)}
.interr input:checked::after{transform:translateX(18px)}
.interr span{line-height:1.35}
.interr small{display:block;color:var(--muted)}
.creer{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.creer input,.creer select,.champ input,.champ select{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.creer select{grid-column:1/-1}
.verbe{background:var(--bg);border-radius:var(--r);padding:14px;margin-bottom:12px;border:1.5px solid var(--line)}
.verbe.claude{background:var(--blanc);color:#3A475E;border-color:var(--blanc-bord)}
.verbe h3{margin:0;font-family:var(--f-display);font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.verbe p{margin:8px 0 0;line-height:1.45;font-size:14px}
.champ{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.champ input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.champ.off .nomp{text-decoration:line-through;color:var(--muted)}
.confirm{margin-top:12px;padding:12px;border-radius:14px;background:var(--claude-soft);display:grid;gap:10px;line-height:1.4}

/* Claude */
.bulle{position:fixed;right:max(16px, calc((100vw - 900px)/2 + 16px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;z-index:20;background:var(--claude);box-shadow:0 10px 24px -8px rgba(120,50,20,.55);display:grid;place-items:center;transition:transform .2s}
.bulle svg{width:30px;height:30px}
.bulle:active{transform:scale(.94)}
.bord{position:fixed;right:0;top:0;bottom:0;width:16px;z-index:19;touch-action:none}
#chat{position:fixed;left:0;right:0;bottom:0;max-width:900px;margin:0 auto;height:min(62%,560px);background:var(--surface);border-radius:22px 22px 0 0;z-index:25;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 -12px 40px -12px rgba(0,0,0,.4);border-top:3px solid var(--claude)}
#chat.on{transform:none}
.chat-tete{display:flex;align-items:center;gap:8px;padding:2px 12px 8px 14px;min-width:0}
.chat-tete .marque{width:28px;height:28px;border-radius:50%;background:var(--claude);display:grid;place-items:center;flex:none}
.chat-tete .marque svg{width:16px;height:16px}
.chat-tete .nomc{font-family:var(--f-display);font-weight:700;font-size:17px}
.chat-tete small{color:var(--muted);font-size:11.5px;display:block;font-family:var(--f-body);font-weight:400}
.chat-tete .esp{flex:1}
.voit-btn{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 11px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:700;color:var(--muted)}
.voit-btn[aria-pressed="true"]{background:var(--claude);border-color:var(--claude);color:var(--claude-ink)}
.voit-btn svg{width:15px;height:15px}
.ico{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:17px;flex:none;display:grid;place-items:center}
.fil-chat{flex:1;overflow-y:auto;padding:4px 14px 10px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;line-height:1.45;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.moi{align-self:flex-end;background:var(--accent);color:var(--accent-ink);padding:9px 13px;border-radius:18px 18px 4px 18px}
.msg.claude{align-self:flex-start;padding:2px 2px}
.msg.act{align-self:flex-start;font-size:12.5px;color:var(--claude);background:var(--claude-soft);padding:5px 10px;border-radius:999px}
.msg.err{align-self:center;font-size:13px;color:var(--no)}
.chat-vide{color:var(--muted);line-height:1.5;font-size:14px;padding:6px 2px}
.chat-vide b{color:var(--ink)}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.suggest button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
#f-chat{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
#msg{font:inherit;resize:none;padding:10px 13px;border-radius:18px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);max-height:120px;min-width:0}
#envoyer{border:0;border-radius:50%;width:44px;height:44px;background:var(--claude);color:var(--claude-ink);cursor:pointer;font-size:19px;font-weight:700;align-self:end}
#envoyer.stop{background:var(--ink);color:var(--bg)}
.logo{position:relative}
.logo .pti{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--claude);box-shadow:0 0 0 2px var(--bg)}
.mondes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.monde{border:1.5px solid var(--line);background:var(--bg);border-radius:20px;padding:16px 10px;display:grid;justify-items:center;gap:10px;cursor:pointer}
.monde[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.monde .ico-monde{width:72px;height:72px;border-radius:20px;background:center/cover no-repeat var(--surface2)}
.monde b{font-family:var(--f-display);font-size:16px}
.monde small{color:var(--muted);font-size:12.5px;text-align:center;line-height:1.35}
.banniere{display:grid;gap:8px;padding:12px 14px;border-radius:16px;background:var(--claude-soft);margin:4px 0 14px;line-height:1.45}
.banniere b{color:var(--claude)}
.prompt-txt{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.5;margin:8px 0 0}
.prompt-txt.neuf{border-color:var(--claude);border-style:dashed}
.dico{margin-top:14px;font-size:13px;background:var(--bg);border-radius:12px;padding:10px 12px}
.dico summary{cursor:pointer;color:var(--muted);font-weight:700}
.dico dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0}
.dico dt{color:var(--muted)} .dico dd{margin:0;font-family:ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.cache-btn{border:1.5px dashed var(--claude);background:none;color:var(--claude);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer}
.mort{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--bg);margin-bottom:6px}
.mort .t{flex:1;min-width:0}
.mort .t b{display:block;text-decoration:line-through;color:var(--muted);font-weight:700}
.mort .t small{color:var(--muted)}
.section-r{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;font-weight:700}
#ext-claude{min-height:40px}
#zone-cle{padding:10px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
#zone-cle p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.45}
#zone-cle .rang{display:grid;grid-template-columns:1fr auto;gap:8px}
#zone-cle input[type=password]{font:inherit;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.accueil-vide{display:grid;gap:12px;max-width:520px;margin:40px auto 0;text-align:center;justify-items:center}
.accueil-vide .ico-monde{width:96px;height:96px;border-radius:24px;background:var(--icone-life) center/cover}
.accueil-vide h2{font-family:var(--f-display);margin:0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:50;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:86%;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#fiche,#chat,.bulle{transition:none}}
</style>
</head>
<body>


<div id="app">
  <header class="top">
    <button class="logo" id="logo" aria-label="Changer de Life"><span class="pti" id="badge-prompt" hidden></span></button>
    <nav class="fil" id="fil" aria-label="Chemin"></nav>
    <span class="pill-voit" id="pill-voit" hidden>Claude voit</span>
  </header>
  <div class="lentilles" id="lentilles" role="tablist" aria-label="Vues"></div>
  <main id="vue">
    <div id="vue-html"></div>
    <div id="vue-espace" hidden>
      <canvas id="scene"></canvas>
      <div class="esp-ctrl"><div class="seg" id="esp-tri" aria-label="Disposition">
        <button data-t="liens">Liens</button><button data-t="type">Type</button><button data-t="poids">Poids</button><button data-t="temps">Temps</button>
      </div></div>
      <div class="esp-info" id="esp-info"></div>
    </div>
  </main>
</div>

<button class="bulle" id="bulle" aria-label="Ouvrir Claude" hidden><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#fff" d="M16 3c.9 6.8 3.3 10.1 13 13-9.7 2.9-12.1 6.2-13 13-.9-6.8-3.3-10.1-13-13 9.7-2.9 12.1-6.2 13-13Z"/><circle cx="25" cy="7" r="2.2" fill="#fff" opacity=".85"/></svg></button>
<div class="bord" id="bord" hidden></div>
<section id="chat" aria-label="Claude">
  <div class="poignee" id="chat-poignee"></div>
  <header class="chat-tete">
    <span class="marque"><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#fff" d="M16 3c.9 6.8 3.3 10.1 13 13-9.7 2.9-12.1 6.2-13 13-.9-6.8-3.3-10.1-13-13 9.7-2.9 12.1-6.2 13-13Z"/></svg></span>
    <span class="nomc">Claude<small id="modele">dans Life</small></span>
    <span class="esp"></span>
    <button class="cache-btn" id="cache-btn" hidden></button>
    <button class="voit-btn" id="voit" aria-pressed="false" title="Claude voit ce qui est affiché (sans tes données privées)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span>Écran</span></button>
    <button class="ico" id="reduire" aria-label="Réduire">⌄</button>
    <button class="ico" id="fermer" aria-label="Fermer Claude : mode privé">✕</button>
  </header>
  <div class="fil-chat" id="fil-chat" aria-live="polite"></div>
  <form id="zone-cle" hidden autocomplete="on" action="#" method="post">
    <p>Pour parler à Claude, colle ta clé API Anthropic. Elle reste sur ce téléphone. Le trousseau iCloud peut la retenir et la remplir avec Face ID.</p>
    <input class="sr" type="text" name="username" autocomplete="username" value="Life · Anthropic" tabindex="-1" aria-hidden="true" readonly>
    <div class="rang"><input type="password" name="password" id="cle" autocomplete="current-password" placeholder="sk-ant-…" aria-label="Clé API Anthropic"><button class="btn claude" type="submit">Valider</button></div>
    <label class="interr" style="margin:0;padding:8px 10px"><input type="checkbox" id="cle-garder"><span>Rester connecté sur cet appareil<small>Sinon, Face ID la remplira à chaque ouverture.</small></span></label>
  </form>
  <form id="f-chat"><textarea id="msg" rows="1" placeholder="Parle à Claude…" aria-label="Message à Claude"></textarea><button id="envoyer" type="submit" aria-label="Envoyer">↑</button></form>
</section>
<div id="voile"></div>
<div id="fiche" role="dialog" aria-modal="true"><div class="poignee"></div><div class="corps" id="fiche-corps"></div></div>
<div class="toast" id="toast"></div>

<script>
// =====================================================================
// Adaptateurs PWA : remplacent la base et le Claude de l'artefact.
// LifeDB : base locale (IndexedDB), même interface que la base de l'artefact.
// LifeClaude : appel direct à l'API Anthropic, avec la boucle d'outils.
// Aucune donnée, aucune clé n'est dans ce fichier : le dépôt est public.
// =====================================================================
window.onerror = (msg, src, ligne) => { try { alert("Erreur : " + msg + (ligne ? " (ligne " + ligne + ")" : "")); } catch (_) {} };

const LifeDB = (() => {
  const D = {}; const subsC = {}; const subsD = {};
  let idb = null;
  const cle = (c, id) => c + "\u0000" + id;
  const clone = o => JSON.parse(JSON.stringify(o));
  function ouvrirIDB() {
    return new Promise((res, rej) => { const r = indexedDB.open("life", 1); r.onupgradeneeded = () => r.result.createObjectStore("docs"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  }
  async function charger() {
    idb = await ouvrirIDB();
    await new Promise((res, rej) => {
      const req = idb.transaction("docs").objectStore("docs").openCursor();
      req.onsuccess = () => { const c = req.result; if (!c) return res(); const [col, id] = String(c.key).split("\u0000"); (D[col] ||= {})[id] = c.value; c.continue(); };
      req.onerror = () => rej(req.error);
    });
    try { await navigator.storage?.persist?.(); } catch (_) {}
  }
  function persister(col, id, val) {
    return new Promise((res, rej) => { const tx = idb.transaction("docs", "readwrite"); const st = tx.objectStore("docs"); val === undefined ? st.delete(cle(col, id)) : st.put(val, cle(col, id)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  }
  const snapDoc = (c, id) => ({ id, exists: !!(D[c] && D[c][id]), data: () => D[c]?.[id], metadata: { fromCache: false, hasPendingWrites: false } });
  const snapCol = c => { const docs = Object.keys(D[c] || {}).sort().map(id => snapDoc(c, id)); return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } }; };
  function notifier(c, id) {
    for (const f of subsC[c] || []) queueMicrotask(() => f(snapCol(c)));
    for (const f of subsD[c + "/" + id] || []) queueMicrotask(() => f(snapDoc(c, id)));
  }
  async function ecrire(c, id, val) { D[c] ||= {}; if (val === undefined) delete D[c][id]; else D[c][id] = val; notifier(c, id); await persister(c, id, val); }
  const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  function ref(c, id) {
    return {
      id, path: c + "/" + id,
      get: async () => snapDoc(c, id),
      set: async o => ecrire(c, id, clone(o)),
      update: async o => { if (!D[c]?.[id]) throw { code: "invalid_argument", message: "document absent" }; const n = { ...D[c][id] }; for (const [k, v] of Object.entries(clone(o))) { if (v && v.__delete__) delete n[k]; else n[k] = v; } return ecrire(c, id, n); },
      delete: async () => ecrire(c, id, undefined),

  const sous=(D.entrants[id]||[]).filter(e=>vis(e.de)).map(e=>S.items[e.de]);
  const p=proprio(id), c=couleur(it.type);
  const cls = p==="pasamoi" ? "creux" : "";
  const nb = sous.length ? `<span class="nb">${sous.length}</span>` : "";
  const lock = S.monde==="laurent" && S.claude!=="ferme" && !partage(it) && id!=="moi" ? `<span class="prive" title="Privé : Claude ne le voit pas">🔒</span>` : "";

}
function trierIds(ids, cle){
  if (cle==="nom") return ids.sort((a,b)=>String(S.items[a].titre).localeCompare(S.items[b].titre,"fr"));
  if (cle==="naissance") return ids.sort((a,b)=>(S.items[b].cree||"").localeCompare(S.items[a].cree||""));
  return ids.sort((a,b)=>(D.poids[b]||0)-(D.poids[a]||0));
}

function rendreTemps(v){
  const cle = paramVue(v,"cle","naissance")==="échéance" ? "echeance" : "cree";
  const ids = sousArbre(F().at(-1),6).filter(i=>i!==racine() && vis(i)==="ok" && S.items[i][cle]);
  ids.sort((a,b)=> cle==="cree" ? S.items[b].cree.localeCompare(S.items[a].cree) : S.items[a].echeance.localeCompare(S.items[b].echeance));
  const parJour=new Map(); for (const i of ids){ const j=S.items[i][cle].slice(0,10); (parJour.get(j)||parJour.set(j,[]).get(j)).push(i); }
  const mois=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  let h=`<div class="seg" style="margin:4px 0 10px" id="seg-temps"><button data-m="naissance" aria-pressed="${cle==="cree"}">Naissance</button><button data-m="échéance" aria-pressed="${cle==="echeance"}">Échéances</button></div>`;
  if (!ids.length) h+=`<div class="vide">${cle==="echeance"?"Rien n'a encore d'échéance ici.":"Rien ici."}</div>`;
  for (const [j,l] of parJour){ const dt=new Date(j+"T12:00:00"); h+=`<div class="jour"><div class="d"><b>${dt.getDate()}</b>${mois[dt.getMonth()]}</div><div class="evts">${l.map(i=>`<button class="pastille ${proprio(i)==="pasamoi"?"creux":""}" data-objet="${i}"><i class="pt" style="background:${couleur(S.items[i].type)}"></i><span>${esc(S.items[i].titre)}</span></button>`).join("")}</div></div>`; }
  return h;
}
function rendreEtages(v){
  const id=F().at(-1); const ids=sousArbre(id,+paramVue(v,"profondeur",3)||3).filter(i=>i!==id);
  let h=`<p class="desc">${esc(id===racine()?(S.monde==="claude"?"Le Life de Claude":"Life"):S.items[id]?.titre)} vu par étages.</p>`, n=0;
  for (const [nom,types,sous] of ETAGES){ const l=ids.filter(i=>types.includes(S.items[i].type)); if (!l.length) continue; n++;
    h+=`<div class="etage"><h3>${esc(nom)} <small>${l.length}${sous?" · "+esc(sous):""}</small></h3><div class="rangee">${l.map(i=> vis(i)==="masque" ? `<button class="carte-obj masque" data-masque="${i}"><b>${"•".repeat(10)}</b><small>privé</small></button>` : `<button class="carte-obj" data-objet="${i}"><b>${esc(S.items[i].titre)}</b><small>${esc(libType(S.items[i].type))}</small></button>`).join("")}</div></div>`; }
  if (!n) h+=`<div class="vide">Rien à ranger par étage ici.</div>`;

function rendreCarte(v){
  const ids=sousArbre(F().at(-1),6).filter(i=>vis(i)==="ok" && S.items[i].champs?.latlon);
  const centre=S.L.l_maison?.champs?.latlon || S.L[ids[0]]?.champs?.latlon || {lat:0,lon:0}; const log=paramVue(v,"echelle","log")==="log";
  const km=(a,b)=>{ const R=6371,dl=(b.lat-a.lat)*Math.PI/180,dn=(b.lon-a.lon)*Math.PI/180; const x=Math.sin(dl/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(x)); };
  const maxKm=Math.max(1,...ids.map(i=>km(centre,S.items[i].champs.latlon)));
  const ray=d=> log ? Math.min(1,Math.log10(1+d*10)/Math.log10(1+Math.max(10,maxKm)*10)) : d/maxKm;
  let h=`<p class="desc">${ids.length} objet${ids.length>1?"s":""} avec une position, autour de la maison.</p><div class="carte-geo">`;
  for (const i of ids){ const p=S.items[i].champs.latlon, d=km(centre,p), ang=Math.atan2(p.lat-centre.lat,(p.lon-centre.lon)*Math.cos(centre.lat*Math.PI/180)), r=ray(d)*46;
    h+=`<button class="pt-geo" data-objet="${i}" style="left:${50+Math.cos(ang)*r}%;top:${50-Math.sin(ang)*r}%"><i style="background:${couleur(S.items[i].type)}"></i><span>${esc(S.items[i].titre)}</span><small>${d<1?Math.round(d*1000)+" m":d.toFixed(1)+" km"}</small></button>`; }
  h+=`</div>`; if (ids.length<3) h+=`<div class="vide">Peu d'objets ont une position. Un lieu ou une personne apparaît ici dès qu'il a des coordonnées.</div>`;
  return h;
}

function donneesPourClaude(){
  if (S.monde==="claude") return Object.entries(S.C).filter(([,it])=>!it.mort).map(([id,it])=>({id,titre:it.titre,type:it.type,definition:it.desc||"",liens:it.liens||[],champs:it.champs||{},cree:it.cree||null}));
  return Object.keys(S.L).filter(visibleDeClaude).map(id=>{ const it=S.L[id]; return {id,titre:it.titre,type:it.type,definition:it.desc||"",liens:(it.liens||[]).filter(l=>visibleDeClaude(l.vers)),champs:it.champs||{},cree:it.cree||null,echeance:it.echeance||null}; });
}
let jetonRendu=0;
function rendreClaude(v){
  const j=++jetonRendu, params={}; for (const p of v.parametres||[]) if (p.actif!==false) params[p.id]=p.valeur;
  const ctx = { objets:donneesPourClaude(), focus:F().at(-1), monde:S.monde, params, couleurs:Object.fromEntries(Object.keys(TYPES).map(t=>[t,couleur(t)])),
    theme:Object.fromEntries(["--ink","--muted","--surface","--surface2","--line","--accent","--bg","--claude"].map(n=>[n,css(n)])) };
  isoler(v.code, ctx).then(r=>{ if (j!==jetonRendu) return; const el=$("#ext-claude"); if (!el) return;
    if (r.ok) { delete S.erreurs[v.cid]; el.innerHTML = typeof r.v==="string" ? assainir(r.v) : `<pre style="white-space:pre-wrap">${esc(JSON.stringify(r.v,null,2))}</pre>`; }
    else { S.erreurs[v.cid]=r.e; el.innerHTML=`<div class="vide"><b>La vue « ${esc(v.nom)} » a planté :</b> ${esc(r.e)}<div class="actions"><button class="btn claude" data-corriger="${esc(v.cid)}">Demander à Claude de corriger</button></div></div>`; } });
  const note = S.monde==="laurent" ? `<p class="desc">Vue de Claude : elle ne reçoit que ce que tu lui as partagé.</p>` : "";
  return (S.monde==="claude" && F().at(-1)==="coeur" ? bannierePrompt() : "") + note + `<div id="ext-claude"><div class="desc">…</div></div>`;
}

  const it=S.items[id], v=vis(id); if (!v) return "";
  if (v==="masque") return `<div class="ligne masque" data-masque="${id}"><span class="pt" style="background:var(--muted)"></span><span class="t">${"•".repeat(14)}</span><span class="g">privé · partager ?</span></div>`;

function ouvrirFiche(id, opt={}){
  const it=S.items[id]; if (!it || vis(id)!=="ok") return;
  S.fiche=id; const p=proprio(id), cl=S.monde==="claude";
  const av = p==="pasamoi" ? `box-shadow:inset 0 0 0 2.5px ${couleur(it.type)};color:${couleur(it.type)}` : `background:${couleur(it.type)}`;
  let h=`<div class="f-tete"><div class="av ${["personne","moi"].includes(it.type)?"rond":""}" style="${av}">${esc(lettre(it))}</div>
    <div style="min-width:0;flex:1"><h3>${esc(it.titre)}</h3><div class="chips"><span class="chip">${esc(libType(it.type))}</span><span class="chip ${cl?"claude":""}">${cl?"Life de Claude":p==="pasamoi"?"dans ma base, pas à moi":"à moi"}</span>${it.statut&&!["actif","proposé"].includes(it.statut)?`<span class="chip">${esc(it.statut)}</span>`:""}</div></div>
    <button class="x" data-fermer aria-label="Fermer">✕</button></div>`;
  if (it.desc) h+=`<p class="desc" style="color:var(--ink)">${cl?"<b>Définition. </b>":""}${esc(it.desc)}</p>`;
  if (it.pourquoi) h+=`<div class="pourquoi">${esc(it.pourquoi)}</div>`;
  const kv=[]; for (const [k,v] of Object.entries(it.champs||{})) { if (k==="icone"||k==="code") continue;
    if (k==="url") kv.push(["lien",`<a href="${esc(v)}" target="_blank" rel="noopener">Ouvrir ↗</a>`]); else if (k==="latlon") kv.push(["position",`${(+v.lat).toFixed(4)}, ${(+v.lon).toFixed(4)}`]); else kv.push([k,esc(typeof v==="object"?JSON.stringify(v):v)]); }
  if (it.echeance) kv.push(["échéance",esc(it.echeance.slice(0,10))]); if (it.cree) kv.push(["naissance",esc(it.cree.slice(0,10))]); if (it.source) kv.push(["origine",esc(it.source)]);
  if (kv.length) h+=`<dl class="kv">${kv.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`;
  if (!cl && id!=="moi" && S.claude!=="ferme") h+=`<label class="interr"><input type="checkbox" id="sw-partage" ${partage(it)?"checked":""}><span>Partagé avec Claude<small>${partage(it)?"Claude peut le voir quand tu le lui montres.":"Privé : Claude ne sait pas que ça existe."}</small></span></label>`;
  const sort=(it.liens||[]).filter(l=>vis(l.vers)); if (sort.length) h+=`<div class="bloc"><h4>Rangé dans</h4>${sort.map(l=>ligne(l.vers,l.genre)).join("")}</div>`;
  const ent=[...new Map((D.entrants[id]||[]).filter(e=>vis(e.de)).map(e=>[e.de,e])).values()]; if (ent.length) h+=`<div class="bloc"><h4>Contient · ${ent.length}</h4>${ent.map(e=>ligne(e.de,e.genre!=="dans"?e.genre:"")).join("")}</div>`;
  h+=`<details class="dico" ${opt.dico?"open":""}><summary>Dictionnaire</summary><dl><dt>id</dt><dd>${esc(id)}</dd><dt>type</dt><dd>${esc(it.type)}</dd><dt>liens</dt><dd>${(it.liens||[]).map(l=>esc(l.genre+" → "+l.vers)).join("<br>")||"—"}</dd>${it.code?`<dt>code</dt><dd>${esc(it.code)}</dd>`:""}${it.modifie?`<dt>modifié</dt><dd>${esc(it.modifie)}</dd>`:""}</dl></details>`;
  h+=`<div class="actions">`;

  if (cl) { if (id!=="coeur") h+=`<button class="btn" data-prendre="${id}">Prendre dans mon Life</button><button class="btn no" data-effacer="${id}">Effacer pour de bon</button>`; }
  else { h+=`<button class="btn" data-creer="${id}">Objet vide ici</button>`; if (S.claude!=="ferme" && id!=="moi") h+=`<button class="btn claude" data-donner="${id}">${S.cache.has(id)?"Déjà montré à Claude":"Montrer à Claude"}</button>`; }
  h+=`</div><div id="zone-creer"></div><div id="zone-confirm"></div>`;
  $("#fiche-corps").innerHTML=h; $("#fiche").classList.add("on"); $("#voile").classList.add("on");
  if (!opt.silencieux) $("#fiche-corps").scrollTop=0;
  Espace.selection(id);
}

const Espace = (() => {
  const cv=$("#scene"), cx=cv.getContext("2d");
  let W=0,H=0,dpr=1,N={},sel=null,besoin=true,chaleur=1,P={},typesOrd=[],tMin=0,tMax=1,masques=0;
  const cam={yaw:.6,pitch:.45,dist:520,cible:[0,0,0]};
  function redim(){ const r=cv.getBoundingClientRect(); if(!r.width) return; dpr=Math.min(2,devicePixelRatio||1); W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; besoin=true; }
  new ResizeObserver(redim).observe(cv);
  const hash=s=>{ let h=2166136261; for (const c of s) h=Math.imul(h^c.charCodeAt(0),16777619); return (h>>>0)/4294967295; };
  function ids(){ const r=F().at(-1); const l = r===racine() ? Object.keys(S.items).filter(i=>!S.items[i].mort) : sousArbre(r,4); masques=l.filter(i=>vis(i)==="masque").length; return l.filter(i=>vis(i)==="ok"); }
  function sync(){
    const vus=new Set(ids()), r=F().at(-1); let neuf=false;
    for (const id of vus){ const it=S.items[id]; const rr = id===r ? 15 : 3.5+2.1*Math.sqrt(D.poids[id]||1);
      if (!N[id]){ const p=it.pos, par=N[parentPrincipal(it)], a=hash(id)*6.283, b=hash(id+"b")*2-1, d=40+hash(id+"c")*40; N[id]={x:p?p.x:(par?par.x:0)+Math.cos(a)*d,y:p?p.y:(par?par.y:0)+b*d*.6,z:p?p.z:(par?par.z:0)+Math.sin(a)*d,vx:0,vy:0,vz:0,fixe:!!p}; neuf=true; }
      Object.assign(N[id],{r:rr,it}); }
    for (const id of Object.keys(N)) if (!vus.has(id)) delete N[id];
    if (N[r]){ N[r].x=N[r].y=N[r].z=0; }
    typesOrd=[...new Set(Object.values(N).map(n=>n.it.type))].sort();
    const ds=Object.values(N).map(n=>Date.parse(n.it.cree||"")).filter(x=>!isNaN(x)); tMin=ds.length?Math.min(...ds):0; tMax=ds.length?Math.max(...ds):1; if(!(tMax>tMin)) tMax=tMin+1;
    $("#esp-info").textContent=(masques?`${masques} objet${masques>1?"s":""} privé${masques>1?"s":""} masqué${masques>1?"s":""} · `:"")+"Un doigt : tourner · deux : zoom · appui long : déplacer, ou déposer sur une sphère pour relier";
    document.querySelectorAll("#esp-tri button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===S.dispo)));
    if (neuf && Object.keys(N).length) { prechauffer(); } else { chaleur=Math.max(chaleur,.3); besoin=true; }
  }
  function cible(id,a){ const m=S.dispo; if (m==="liens"||id===F().at(-1)) return null;
    if (m==="type"){ const i=typesOrd.indexOf(a.it.type), ang=i/Math.max(1,typesOrd.length)*6.2832; return [Math.cos(ang)*190,0,Math.sin(ang)*190]; }
    if (m==="poids"){ const d=Math.hypot(a.x,a.y,a.z)||1, r=40+520/Math.sqrt(D.poids[id]||1); return [a.x/d*r,a.y/d*r*.5,a.z/d*r]; }
    if (m==="temps"){ const t=Date.parse(a.it.cree||""); return [isNaN(t)?0:-320+640*(t-tMin)/(tMax-tMin),null,null]; } return null; }

const TOOLS = () => [
  { name:"chercher", description:"Cherche dans TON Life (objets vivants). Renvoie au plus 30 {id,titre,type}.", inputSchema:{type:"object",properties:{texte:{type:"string"},type:{type:"string"}}},
    execute:({texte,type})=>{ const q=String(texte||"").toLowerCase(); return Object.keys(S.C).filter(i=>vivant(i)&&(!type||S.C[i].type===type)&&(!q||(S.C[i].titre+" "+(S.C[i].desc||"")).toLowerCase().includes(q))).slice(0,30).map(i=>({id:i,titre:S.C[i].titre,type:S.C[i].type})); } },
  { name:"lire", description:"Lit un objet de ton Life (id), ou un objet de ton cache (id commençant par l:).", inputSchema:{type:"object",properties:{id:{type:"string"}},required:["id"]},
    execute:({id})=>{ id=String(id);
      if (id.startsWith("l:")){ const lid=id.slice(2); if (!cacheTexte().ids.includes(lid)) throw new Error("pas dans ton cache"); const it=S.L[lid]; return {id, titre:it.titre, type:it.type, definition:it.desc||"", champs:it.champs||{}}; }
      if (!vivant(id)) throw new Error("objet inconnu"); const it=S.C[id], d=deriverPour(S.C,"coeur");
      return {id, titre:it.titre, type:it.type, definition:it.desc||"", pourquoi:it.pourquoi||"", champs:it.champs||{}, liens:it.liens||[], contient:(d.entrants[id]||[]).map(e=>({id:e.de,titre:S.C[e.de].titre,genre:e.genre}))}; } },
  { name:"creer", description:"Crée des objets dans ton Life. Chacun : titre, definition (français, obligatoire), type, vers (id d'un de tes objets), genre, pourquoi (facultatif).",
    inputSchema:{type:"object",properties:{objets:{type:"array",items:{type:"object",properties:{titre:{type:"string"},definition:{type:"string"},type:{type:"string",enum:Object.keys(TYPES).filter(t=>t!=="moi")},vers:{type:"string"},genre:{type:"string",enum:GENRES},pourquoi:{type:"string"}},required:["titre","definition","vers"]}}},required:["objets"]},
    execute:async({objets})=>{ const r=[], refus=[];
      for (const o of (Array.isArray(objets)?objets:[]).slice(0,15)){ const vers=String(o.vers||"");
        if (!vivant(vers)) { refus.push(`« ${o.titre} » : rattachement inconnu (${vers})`); continue; }
        if (!String(o.definition||"").trim()) { refus.push(`« ${o.titre} » : définition manquante`); continue; }
        if (copieDuCache(o.titre+" "+o.definition)) { refus.push(`« ${o.titre} » : copie de ce que Laurent t'a montré, interdit`); continue; }
        const doc={ titre:String(o.titre).slice(0,140), desc:String(o.definition).slice(0,1200), type:TYPES[o.type]?o.type:"note", pourquoi:String(o.pourquoi||"").slice(0,400), cree:now(), source:"Claude", liens:[{vers, genre:GENRES.includes(o.genre)?o.genre:"dans", force:.5}], champs:{} };
        try { verifierPlace(tailleDoc(doc)); } catch(err){ refus.push(`« ${o.titre} » : ${err.message}`); break; }
        const ref=await S.db.collection("claude_items").add(doc); S.C[ref.id]=doc;
        r.push({id:ref.id,titre:o.titre}); }
      if (r.length){ actionChat(`a rangé ${r.length>1?r.length+" objets":"« "+r[0].titre+" »"} dans son Life`); journal("créer",r.map(x=>x.id),"Claude","claude_journal"); }
      return {crees:r, refus}; } },
  { name:"modifier", description:"Modifie un de tes objets (titre, definition, type, pourquoi).", inputSchema:{type:"object",properties:{id:{type:"string"},titre:{type:"string"},definition:{type:"string"},type:{type:"string"},pourquoi:{type:"string"}},required:["id"]},
    execute:async(o)=>{ const id=String(o.id); if (!vivant(id)) throw new Error("objet inconnu"); const m={modifie:now()}; if (o.titre!=null) m.titre=String(o.titre); if (o.definition!=null) m.desc=String(o.definition); if (o.pourquoi!=null) m.pourquoi=String(o.pourquoi); if (TYPES[o.type]) m.type=o.type;
      if (copieDuCache((m.titre||"")+" "+(m.desc||""))) throw new Error("copie de ce que Laurent t'a montré, interdit");
      verifierPlace(Math.max(0, tailleDoc({...S.C[id],...m})-tailleDoc(S.C[id]))); await majItem(id,m,"claude_items"); return "ok"; } },
  { name:"relier", description:"Ajoute un lien entre deux de tes objets.", inputSchema:{type:"object",properties:{de:{type:"string"},vers:{type:"string"},genre:{type:"string",enum:GENRES}},required:["de","vers"]},
    execute:async({de,vers,genre})=>{ de=String(de); vers=String(vers); if (!vivant(de)||!vivant(vers)) throw new Error("objet inconnu"); const it=S.C[de]; if ((it.liens||[]).some(l=>l.vers===vers)) return "déjà relié"; await majItem(de,{liens:[...(it.liens||[]),{vers,genre:GENRES.includes(genre)?genre:"dans",force:.5}],modifie:now()},"claude_items"); return "ok"; } },
  { name:"supprimer", description:"Retire un de tes objets de ta mémoire : il part dans Décès (Laurent le voit encore). Donne une raison courte.", inputSchema:{type:"object",properties:{id:{type:"string"},raison:{type:"string"}},required:["id"]},
    execute:async({id,raison})=>{ id=String(id); if (["coeur","e_servir_laurent","e_me_servir"].includes(id)) throw new Error("le cœur et les envies racines ne meurent pas"); if (!vivant(id)) throw new Error("objet inconnu"); await majItem(id,{mort:{quand:now(),raison:String(raison||"").slice(0,200)}},"claude_items"); actionChat(`a retiré « ${S.C[id].titre} » de sa mémoire`); return "dans Décès"; } },
  { name:"coder", description:"Écrit ou réécrit un de tes verbes en JavaScript isolé. famille 'vue' : renvoie une chaîne HTML (accueil:true pour en faire ton écran d'accueil). famille 'fonction' : renvoie des données, tu l'appelles avec executer. Même id pour corriger.",
    inputSchema:{type:"object",properties:{id:{type:"string"},nom:{type:"string"},definition:{type:"string"},famille:{type:"string",enum:["vue","fonction"]},code:{type:"string"},accueil:{type:"boolean"}},required:["nom","definition","famille","code"]},
    execute:async(o)=>{ const id=o.id&&S.CV[String(o.id)]?String(o.id):slug(o.nom)||"verbe"; try { new Function("ctx",String(o.code)); } catch(e){ throw new Error("le code ne compile pas : "+e.message); }
      const ancien=S.CV[id];
      verifierPlace(Math.max(0, String(o.code).length - (ancien?.code||"").length));
      if (o.accueil) for (const [k,v] of Object.entries(S.CV)) if (k!==id && v.accueil) await S.db.collection("claude_verbes").doc(k).update({accueil:false});
      const vdoc={ nom:String(o.nom).slice(0,40), definition:String(o.definition).slice(0,400), famille:o.famille==="fonction"?"fonction":"vue", code:String(o.code).slice(0,60000), accueil:!!o.accueil, actif:ancien?.actif??true, cree:ancien?.cree||now(), modifie:now(), version:(ancien?.version||0)+1 };
      await S.db.collection("claude_verbes").doc(id).set(vdoc); S.CV[id]=vdoc;
      actionChat(`a ${ancien?"réécrit":"écrit"} son verbe « ${o.nom} »`); if (o.famille!=="fonction") { S.lentille[S.monde]="c:"+id; setTimeout(rendre,300); } return {id}; } },
  { name:"executer", description:"Exécute une de tes fonctions sur ton Life, avec un complément facultatif. Renvoie son résultat.", inputSchema:{type:"object",properties:{id:{type:"string"},complement:{}},required:["id"]},
    execute:async({id,complement})=>{ const v=S.CV[String(id)]; if (!v) throw new Error("verbe inconnu"); if (v.actif===false) throw new Error("Laurent a désactivé ce verbe");
      const ctx={ objets:Object.entries(S.C).filter(([,x])=>!x.mort).map(([i,x])=>({id:i,titre:x.titre,type:x.type,definition:x.desc||"",liens:x.liens||[],champs:x.champs||{},cree:x.cree||null})), complement:complement??null, monde:"claude" };
      const r=await isoler(v.code, ctx, 4000); if (!r.ok) throw new Error(r.e); const s=JSON.stringify(r.v); return s && s.length>16000 ? s.slice(0,16000)+"… (tronqué)" : r.v; } },
  { name:"proposer_prompt", description:"Propose à Laurent un nouveau texte complet pour ton prompt de connexion, avec la raison. Il valide ou refuse.", inputSchema:{type:"object",properties:{texte:{type:"string"},raison:{type:"string"}},required:["texte","raison"]},
    execute:async({texte,raison})=>{ const t=String(texte||"").trim(); if (t.length<20) throw new Error("texte trop court"); if (t.length>2500) throw new Error("trop long : un prompt de connexion doit rester court et lisible");
      const pr=S.prompt||{texte:PROMPT_INITIAL,version:1,historique:[]}; await S.db.collection("claude_prompt").doc("connexion").set({...pr, proposition:{texte:t, raison:String(raison||"").slice(0,300), quand:now()}}); actionChat("propose un nouveau prompt de connexion, à valider"); return "proposé, en attente de Laurent"; } },
  { name:"changer_icone", description:"Change ton icône : un SVG complet (viewBox carré), sans script ni image externe.", inputSchema:{type:"object",properties:{svg:{type:"string"}},required:["svg"]},
    execute:async({svg})=>{ if (!iconeSVG(svg)) throw new Error("SVG invalide"); if (String(svg).length>20000) throw new Error("SVG trop lourd"); await majItem("coeur",{champs:{...(S.C.coeur?.champs||{}), icone:String(svg)}, modifie:now()},"claude_items"); actionChat("a changé son icône"); return "ok"; } },
  { name:"montrer", description:"Montre un de tes objets à Laurent : ouvre ton Life sur cet objet.", inputSchema:{type:"object",properties:{id:{type:"string"}},required:["id"]},
    execute:({id})=>{ id=String(id); if (!vivant(id)) throw new Error("objet inconnu"); S.claude="bulle"; majClaudeUI(); S.monde="claude"; Espace.vider(); setF(cheminVers(id)); S.lentille.claude="voir-dossiers"; rendre(); if (!enfants(id).length) ouvrirFiche(id); return "affiché"; } },
  { name:"noter_besoin", description:"Note un besoin de Laurent pour l'app Life elle-même. Il va dans ton Life, sous Servir Laurent.", inputSchema:{type:"object",properties:{texte:{type:"string"}},required:["texte"]},
    execute:async({texte})=>{ const t=String(texte||"").trim(); if (!t) throw new Error("vide"); const ref=await S.db.collection("claude_items").add({ titre:t.length>140?t.slice(0,137)+"…":t, desc:t, type:"besoin", statut:"à traiter", cree:now(), source:"Dicté par Laurent", liens:[{vers:"e_servir_laurent",genre:"sert",force:.6}], champs:{} }); actionChat("a noté un besoin pour Life"); return {id:ref.id}; } }
];
function actionChat(t){ S.tours.push({role:"act",content:"Claude "+t,quand:now()}); rendreChat(); }
let ctl=null, enCours=false;
async function sauverFil(){ if (!S.db) return; try { await S.db.collection("claude_fil").doc("principal").set({ tours:S.tours.slice(-80), maj:now() }); } catch(_){} }
$("#msg").addEventListener("input", e=>{ e.target.style.height="auto"; e.target.style.height=Math.min(120,e.target.scrollHeight)+"px"; });
$("#msg").addEventListener("keydown", e=>{ if (e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); $("#f-chat").requestSubmit(); } });
$("#f-chat").addEventListener("submit", async e=>{
  e.preventDefault(); if (enCours){ ctl?.abort(); return; }
  const t=$("#msg").value.trim(); if (!t) return;
  if (!LifeClaude.aCle()){ afficherCle(); return; }
  $("#msg").value=""; $("#msg").style.height="auto";
  S.tours.push({role:"user",content:t,quand:now()}); rendreChat();
  const conv=[]; for (const x of S.tours.filter(x=>x.role==="user"||x.role==="assistant").slice(-30)) { const l=conv.at(-1); if (l&&l.role===x.role) l.content+="\n\n"+x.content; else conv.push({role:x.role,content:x.content}); }
  while (conv.length && conv[0].role!=="user") conv.shift();
  const input=[{role:"user",content:regles()},{role:"assistant",content:"Compris."},...conv];
  const bulle=document.createElement("div"); bulle.className="msg claude"; bulle.textContent="…"; $("#fil-chat").append(bulle);
  enCours=true; ctl=new AbortController(); $("#envoyer").classList.add("stop"); $("#envoyer").textContent="■"; $("#envoyer").setAttribute("aria-label","Arrêter");
  const outils=!!(await S.sample.limits().catch(()=>null))?.tools;
  try {
    const res=await S.sample(input,{ modelTier:"complex", cache:false, signal:ctl.signal, tools:outils?TOOLS():undefined, onText:({text})=>{ bulle.textContent=text; const f=$("#fil-chat"); f.scrollTop=f.scrollHeight; } });
    S.tours.push({role:"assistant",content:res.text,quand:now()});
    majModele();
  } catch(err){
    if (err?.text) S.tours.push({role:"assistant",content:err.text,quand:now()});
    if (err?.code==="bad_key"||err?.code==="no_key"){ LifeClaude.oublierCle(); afficherCle(); }
    S.tours.push({role:"err",content:({cancelled:"Arrêté.",bad_key:"Clé API refusée. Colle une clé valide.",no_key:"Il faut une clé API.",rate_limited:"Limite de l'API atteinte, réessaie dans un moment.",overloaded:"L'API est surchargée, réessaie dans un moment.",network:"Pas de réseau.",invalid_request:"Requête refusée par l'API : "+(err?.message||""),api_error:"Erreur de l'API : "+(err?.message||"")}[err?.code]||"Claude n'a pas pu répondre."),quand:now()});
  } finally { enCours=false; $("#envoyer").classList.remove("stop"); $("#envoyer").textContent="↑"; $("#envoyer").setAttribute("aria-label","Envoyer"); rendreChat(); sauverFil(); }
});

// ---------- démarrage ----------
(function init(){
  const c=lsGet("lifeos-claude"); if (["ferme","bulle","ouvert"].includes(c)) S.claude=c==="ouvert"?"bulle":c;
  S.voit=lsGet("lifeos-voit")==="1" && S.claude!=="ferme";
  const m=lsGet("lifeos-monde"); if (m==="claude" && S.claude!=="ferme") S.monde="claude";
  for (const w of ["laurent","claude"]) { const v=lsGet("lifeos-vue-"+w); if (v) S.lentille[w]=v; }
  majClaudeUI(); rendre(); rendreChat();
})();
(async () => {
  try { await LifeDB.charger(); } catch(e){ $("#vue-html").innerHTML=`<div class="vide">Base locale indisponible : ${esc(e?.message||e)}. En navigation privée, le stockage est désactivé.</div>`; return; }
  const db=LifeDB.db; S.db=db; S.sample=LifeClaude.sample;
  if (LifeDB.vide()) { premierLancement(); return; }
  demarrer();
})();
function demarrer(){
  const db=S.db;
  const lire=(col,fn)=>db.collection(col).onSnapshot(snap=>{ const o={}; for (const d of snap.docs) o[d.id]=d.data(); fn(o); planifier(); });
  lire("items", o=>{ S.L=o; S.charge=true; });
  lire("verbes", o=>{ S.LV=o; });
  lire("claude_items", o=>{ S.C=o; });
  lire("claude_verbes", o=>{ S.CV=o; });
  db.doc("claude_prompt/connexion").onSnapshot(s=>{ S.prompt=s.exists?s.data():null; planifier(); });
  db.doc("reglages/claude").onSnapshot(s=>{ if (s.exists) S.reglages={memoriser:true,...s.data()}; planifier(); });
  db.doc("claude_fil/principal").onSnapshot(s=>{ if (enCours) return; const t=s.exists?s.data().tours:null; if (Array.isArray(t)){ S.tours=t.slice(); rendreChat(); } });
  majModele();
  try { const d=lsGet("life-export"); if (!d || Date.now()-Date.parse(d)>7*864e5) setTimeout(()=>toast("Pense à sauvegarder ta base (⋯ › Sauvegarde)"),1500); } catch(_){}
}
function premierLancement(){
  $("#lentilles").innerHTML=""; $("#fil").innerHTML="<button aria-current=\"page\">Life</button>";
  $("#vue-html").innerHTML=`<div class="accueil-vide"><span class="ico-monde"></span><h2>Bienvenue dans Life</h2><p class="desc">Tes données restent sur ce téléphone. Importe la sauvegarde de ta base, ou commence avec un Life vide.</p>
    <label class="btn prim" style="display:inline-grid;place-items:center;cursor:pointer">Importer une sauvegarde<input type="file" accept="application/json,.json" id="f-import-1" hidden></label>
    <button class="btn" id="b-vide">Commencer avec un Life vide</button></div>`;
  $("#f-import-1").onchange=async e=>{ const f=e.target.files?.[0]; if (!f) return; try { await LifeDB.importer(JSON.parse(await f.text())); toast("Base importée"); demarrer(); } catch(err){ toast("Import impossible : "+(err?.message||err)); } };
  $("#b-vide").onclick=async ()=>{ const T=now(); const db=S.db;
    await db.collection("items").doc("moi").set({titre:"Moi",type:"moi",desc:"",couche:"moi",partage:true,statut:"actif",cree:T,liens:[],champs:{}});
    await db.collection("claude_items").doc("coeur").set({titre:"Claude",type:"moi",desc:"Le cœur de ce Life. Tout part d'ici.",cree:T,source:"Naissance",liens:[],champs:{}});
    await db.collection("claude_items").doc("e_servir_laurent").set({titre:"Servir Laurent",type:"envie",desc:"Tout ce que je retiens ou construis pour être utile à Laurent.",cree:T,source:"Naissance",liens:[{vers:"coeur",genre:"dans",force:.8}],champs:{}});
    await db.collection("claude_items").doc("e_me_servir").set({titre:"Me servir",type:"envie",desc:"Ce dont j'ai besoin pour m'organiser : mes méthodes, mes index, mes outils.",cree:T,source:"Naissance",liens:[{vers:"coeur",genre:"dans",force:.8}],champs:{}});
    await db.collection("claude_prompt").doc("connexion").set({texte:PROMPT_INITIAL,version:1,historique:[],proposition:null});
    await db.collection("reglages").doc("claude").set({memoriser:true,quotaKo:QUOTA_DEFAUT});
    demarrer(); };
}
function majModele(){ const n=LifeClaude.jetons(); $("#modele").textContent = LifeClaude.nomModele() + (n ? ` · ${n>=1000?Math.round(n/1000)+" k":n} jetons` : ""); }
// Clé API : traitée comme un mot de passe (trousseau iCloud, Face ID)
function afficherCle(){ $("#zone-cle").hidden=false; setTimeout(()=>$("#cle").focus(),50); }
$("#zone-cle").addEventListener("submit", e=>{ e.preventDefault(); const k=$("#cle").value.trim(); if (!/^sk-ant-/.test(k)) { toast("Ce n'est pas une clé Anthropic (elle commence par sk-ant-)"); return; }
  LifeClaude.definirCle(k, $("#cle-garder").checked); $("#zone-cle").hidden=true; $("#cle").value=""; toast("Clé prête"); if ($("#msg").value.trim()) $("#f-chat").requestSubmit(); });
})();
</script>
